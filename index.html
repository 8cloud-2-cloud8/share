/* ---------- 结算操作 ---------- */
function buildSettlementText(project) {
  const pending = project.expenses.filter(e => !e.settled && needsSettlement(e));
  const total = pending.reduce((sum, e) => sum + e.amountCents, 0);
  const summary = computeMemberTotals(project, pending);
  const transfers = computeTransfers(summary);
  const lines = [];
  lines.push('【' + project.name + '】旅费结算单');
  lines.push('日期：' + rangeLabel(project.startDate, project.endDate));
  lines.push('待结清：' + money(total, true, true) + ' · ' + pending.length + ' 笔账目');
  lines.push('总支出：' + money(computeProjectStats(project).totalCents, true, true) + ' · 人均 ' + money(computeProjectStats(project).avgCents, true, true));
  lines.push('');
  if (!transfers.length) {
    lines.push('本次无需转账，账目已互相抵消。');
  } else {
    lines.push('建议转账：');
    transfers.forEach((t, i) => lines.push((i + 1) + '. ' + t.fromName + ' → ' + t.toName + ' ' + money(t.amountCents, true, true)));
  }
  lines.push('');
  lines.push('成员收支：');
  summary.forEach(m => {
    const net = m.netCents > 0 ? '应收 ' + money(m.netCents, true, true) : m.netCents < 0 ? '应付 ' + money(-m.netCents, true, true) : '已平';
    lines.push(m.name + '：垫付 ' + money(m.paidCents, true, true) + '，应摊 ' + money(m.shareCents, true, true) + '，' + net);
  });
  lines.push('');
  lines.push('由「乐享」生成');
  return lines.join('\n');
}

async function copySettlement(project) {
  const pending = project.expenses.filter(e => !e.settled && needsSettlement(e));
  if (!pending.length) { toast('当前没有待结清账目', 'warn'); return; }
  const ok = await copyText(buildSettlementText(project));
  if (ok) toast('结算清单已复制');
  else toast('复制失败，请长按页面内容手动复制', 'error');
}

async function recordSettlement(project) {
  const pending = project.expenses.filter(e => !e.settled && needsSettlement(e));
  if (!pending.length) { toast('当前没有待结清账目', 'warn'); return; }
  const total = pending.reduce((sum, e) => sum + e.amountCents, 0);
  const ok = await confirmDialog({
    title: '记录本次结清？',
    message: '将把 ' + pending.length + ' 笔、共 ' + money(total) + ' 的账目标记为已结清，并保存这次转账方案。之后新增的账目会重新累计。',
    okText: '记录结清'
  });
  if (!ok) return;
  const stillPending = project.expenses.filter(e => !e.settled && needsSettlement(e));
  if (!stillPending.length) { toast('账目状态已变化，请重试', 'warn'); return; }
  const currentSummary = computeMemberTotals(project, stillPending);
  const currentTransfers = computeTransfers(currentSummary);
  const now = nowISO();
  stillPending.forEach(e => { e.settled = true; });
  project.settlements.push({
    id: uid('s'),
    createdAt: now,
    totalCents: stillPending.reduce((sum, e) => sum + e.amountCents, 0),
    expenseIds: stillPending.map(e => e.id),
    transfers: currentTransfers.map(t => ({
      fromId: t.fromId, toId: t.toId, fromName: t.fromName, toName: t.toName, amountCents: t.amountCents
    }))
  });
  touchProject(project);
  saveDB();
  closeSheet();
  renderApp();
  toast('已记录结清，新增支出会重新累计');
}

async function undoSettlement(project, settlementId) {
  const settlement = project.settlements.find(s => s.id === settlementId);
  if (!settlement) return;
  const latest = project.settlements[project.settlements.length - 1];
  if (!latest || latest.id !== settlement.id) {
    toast('只能撤销最近一次结清', 'warn');
    return;
  }
  const ok = await confirmDialog({
    title: '撤销这次结清？',
    message: '对应的 ' + settlement.expenseIds.length + ' 笔账目会恢复为待结清状态，结算记录也会删除。',
    okText: '撤销',
    danger: true
  });
  if (!ok) return;
  project.expenses.forEach(e => {
    if (settlement.expenseIds.includes(e.id)) e.settled = false;
  });
  project.settlements = project.settlements.filter(s => s.id !== settlement.id);
  touchProject(project);
  saveDB();
  renderApp();
  toast('已撤销结清');
}

/* ---------- 全局操作 ---------- */
async function handleAction(action, target) {
  const project = getCurrentProject();
  switch (action) {
    case 'new-project': openNewProject(); break;
    case 'open-project': goProject(target.dataset.id); break;
    case 'edit-subcategories':
      if (target.dataset.category) openSubcategoryEditor(getCurrentProject(), target.dataset.category);
      break;
    case 'toggle-privacy':
      ui.privacyHidden = !ui.privacyHidden;
      renderApp();
      break;
    case 'back-home': goHome(); break;
    case 'filter':
      ui.ledgerFilter = target.dataset.cat || 'all';
      {
        const panel = document.getElementById('ledgerPanel');
        if (project && panel) panel.innerHTML = renderLedger(project);
        else renderApp();
      }
      break;
    case 'jump': {
      const section = document.getElementById(target.dataset.target);
      if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
      break;
    }
    case 'open-expense':
      if (project) openExpenseSheet(project, null);
      break;
    case 'open-ledger-details': openLedgerDetails(); break;
    case 'open-expense-detail': {
      if (!project) return;
      const expense = findExpense(project, target.dataset.id);
      if (expense) openExpenseDetail(project, expense);
      break;
    }
    case 'edit-expense': {
      if (!project) return;
      const expense = findExpense(project, target.dataset.id);
      if (!expense) return;
      if (expense.settled) {
        toast('这笔账目已结清，如需修改请先在项目主页面的结算区撤销', 'warn');
        return;
      }
      openExpenseSheet(project, expense);
      break;
    }
    case 'open-settings': openSettings(); break;
    case 'open-appearance': openAppearance(); break;
    case 'open-budgets':
      if (project) openBudgetEditor(project, target.dataset.return === 'settings');
      break;
    case 'open-sample': addSampleProject(); break;
    case 'data-manager': openDataManager(); break;
    case 'show-help': openHelp(); break;
    case 'add-member':
      if (project) openMemberEditor(project, null);
      break;
    case 'edit-member':
      if (project) openMemberEditor(project, target.dataset.id);
      break;
    case 'add-limit':
      if (project) openLimitEditor(project, null);
      break;
    case 'edit-limit':
      if (project) openLimitEditor(project, target.dataset.id);
      break;
    case 'export-json': exportAllJSON(); break;
    case 'export-csv': exportProjectCSV(project); break;
    case 'import-data': pickImportFile(); break;
    case 'copy-settlement': if (project) await copySettlement(project); break;
    case 'settle-now': if (project) await recordSettlement(project); break;
    case 'undo-settlement': if (project) await undoSettlement(project, target.dataset.id); break;
    case 'delete-project':
      if (!project) return;
      {
        const ok = await confirmDialog({
          title: '删除「' + project.name + '」？',
          message: '项目里的 ' + project.expenses.length + ' 笔账目、成员和结算记录都会一起删除，无法恢复。',
          okText: '删除项目',
          danger: true
        });
        if (!ok) return;
        db.projects = db.projects.filter(p => p.id !== project.id);
        saveDB();
        closeSheet();
        goHome();
        toast('项目已删除');
      }
      break;
    case 'clear-all-data': {
      const ok = await confirmDialog({
        title: '清空全部数据？',
        message: '本机所有项目、账目和结算记录都会被删除，无法恢复。建议先导出备份。',
        okText: '确认清空',
        danger: true
      });
      if (!ok) return;
      db = { version: APP_VERSION, settings: normalizeAppSettings(null), projects: [] };
      saveDB();
      applyAppearance();
      closeSheet();
      goHome();
      toast('本机数据已清空');
      break;
    }
    case 'close-sheet': closeSheet(); break;
    default: break;
  }
}

/* ---------- 记一笔 / 编辑账目 ---------- */
function defaultExpenseDate(project) {
  const today = todayISO();
  if (project.startDate && today < project.startDate) return project.startDate;
  if (project.endDate && today > project.endDate) return project.endDate;
  return today;
}

function openExpenseSheet(project, existing) {
  if (existing && existing.settled) {
    toast('这笔账目已结清，如需修改请先在项目主页面的结算区撤销', 'warn');
    return;
  }
  const isEdit = !!existing;
  const allIds = project.members.map(m => m.id);
  let participantIds = existing ? existing.participants.filter(id => project.members.some(m => m.id === id)) : allIds.slice();
  if (!participantIds.length) participantIds = allIds.slice();
  const draft = {
    category: existing ? existing.category : 'transport',
    subcategory: existing ? existing.subcategory : projectSubs(project, 'transport')[0],
    payerId: existing ? existing.payerId : project.members[0].id,
    splitMode: existing ? existing.splitMode : 'equal',
    participants: new Set(participantIds),
    weights: Object.assign({}, existing ? existing.weights : {}),
    customCents: Object.assign({}, existing ? existing.customCents : {}),
    receipt: existing ? existing.receipt || '' : ''
  };
  draft.participants.forEach(id => {
    if (!(Number(draft.weights[id]) > 0)) draft.weights[id] = 1;
  });
  if (draft.payerId === EXTERNAL_PAYER_ID) draft.splitMode = 'none';
  if (draft.splitMode === 'personal') {
    draft.participants = new Set([participantIds[0]]);
  }

  const catButtons = CAT_ORDER.map(key => {
    const cat = catMeta(key);
    return '<button type="button" class="category-btn ' + (key === draft.category ? 'on' : '') + '" data-cat="' + key + '" style="' + catStyle(cat) + '">' +
      icon(cat.icon) + '<span>' + cat.label + '</span></button>';
  }).join('');

  let initialDetail = existing ? (existing.detail || '') : '';
  if (existing && existing.title && existing.title !== existing.subcategory && !initialDetail.includes(existing.title)) {
    initialDetail = existing.title + (initialDetail ? '；' + initialDetail : '');
  }
  const amountValue = existing ? (existing.amountExpression || centsToInput(existing.amountCents)) : '';
  const body = '<form id="expenseForm" novalidate>' +
    '<div class="field"><div class="field-label">大项</div><div class="category-picker" id="catPicker">' + catButtons + '</div>' +
      '<div class="subchips" id="subWrap"></div>' +
      '<p class="field-hint" style="margin-top:7px">细项可在「项目设置 → 分类细项」中增减、改名或删除。</p></div>' +
    '<div class="field"><label class="field-label" for="expDate">时间</label>' +
      '<input class="input" id="expDate" type="date" value="' + esc(existing ? existing.date : defaultExpenseDate(project)) + '"></div>' +
    '<div class="amount-block">' +
      '<div class="amount-label"><span>金额</span><span>可输入算式</span></div>' +
      '<div class="amount-input-wrap"><span class="amount-currency">¥</span>' +
        '<input class="amount-input" id="expAmount" inputmode="decimal" autocomplete="off" placeholder="0" ' +
          'value="' + esc(amountValue) + '" aria-label="金额"></div>' +
      '<div class="calc-row">' +
        ['+', '−', '×', '÷', '(', ')'].map(v => '<button type="button" class="calc-key" data-calc="' + v + '">' + v + '</button>').join('') +
        '<button type="button" class="calc-key" data-calc-back aria-label="退格">⌫</button>' +
        '<span class="amount-preview" id="amountPreview"></span></div>' +
      '<div class="amount-error" id="amountError"></div>' +
    '</div>' +
    '<div class="field"><label class="field-label" for="expDetail">具体明细 <span class="optional">可选 · 可换行分段</span></label>' +
      '<textarea class="textarea" id="expDetail" maxlength="200" placeholder="例如：珠海飞上海 2408*0.6=1444.8 元" style="min-height:82px">' + esc(initialDetail) + '</textarea></div>' +
    '<div class="field"><div class="field-label">暂付款方</div><div class="member-select" id="payerSelect">' + payerChipsHTML(project, draft) + '</div></div>' +
    '<div class="split-section" id="splitArea"></div>' +
    '<div class="field"><label class="field-label" for="expNote">备注 <span class="optional">可选</span></label>' +
      '<textarea class="textarea" id="expNote" maxlength="300" placeholder="任意备注，可留空">' + esc(existing ? existing.note : '') + '</textarea></div>' +
    '<div class="receipt-field">' +
      '<div class="field-label">支付清单 <span class="optional">可选 · 小票/账单</span></div>' +
      '<div id="receiptPreview" class="receipt-preview"></div>' +
      '<div class="image-setting-row"><button type="button" id="receiptPick">上传支付清单</button>' +
        '<button type="button" class="remove-image ' + (draft.receipt ? '' : 'hidden') + '" id="receiptRemove">移除</button>' +
        '<span class="stats-card-note">自动压缩后保存在本机</span></div>' +
      '<input class="hidden" type="file" id="receiptInput" accept="image/*">' +
    '</div>' +
    '<div id="expError"></div>' +
    (isEdit ? '<button class="btn btn-danger btn-block btn-sm" type="button" id="expDelete" style="margin-top:4px">' + icon('trash') + '删除这笔账目</button>' : '') +
  '</form>';

  openSheet({
    title: isEdit ? '编辑账目' : '记一笔',
    subtitle: ui.privacyHidden ? '***' : project.name,
    body,
    footer: '<button class="btn btn-primary" type="submit" form="expenseForm">' + icon('check') + (isEdit ? '保存修改' : '保存账目') + '</button>',
    onMount(backdrop) {
      const form = backdrop.querySelector('#expenseForm');
      const amountInput = backdrop.querySelector('#expAmount');
      const preview = backdrop.querySelector('#amountPreview');
      const amountError = backdrop.querySelector('#amountError');
      const errorBox = backdrop.querySelector('#expError');
      const subWrap = backdrop.querySelector('#subWrap');
      const splitArea = backdrop.querySelector('#splitArea');
      const payerSelect = backdrop.querySelector('#payerSelect');

      function showExpenseError(message) {
        errorBox.innerHTML = '<div class="form-error">' + esc(message) + '</div>';
        toast(message, 'warn');
      }
      function showAmountError(message) {
        amountError.textContent = message;
        toast(message, 'warn');
      }

      const receiptPreview = backdrop.querySelector('#receiptPreview');
      const receiptInput = backdrop.querySelector('#receiptInput');
      const receiptRemove = backdrop.querySelector('#receiptRemove');
      const receiptPickBtn = backdrop.querySelector('#receiptPick');
      function renderReceiptPreview() {
        receiptPickBtn.textContent = draft.receipt ? '更换支付清单' : '上传支付清单';
        if (draft.receipt) {
          receiptPreview.innerHTML = '<img src="' + draft.receipt + '" alt="支付清单预览"><button type="button" class="receipt-open" id="receiptPreviewOpen">查看大图</button>';
          receiptRemove.classList.remove('hidden');
          const open = backdrop.querySelector('#receiptPreviewOpen');
          if (open) open.addEventListener('click', () => openImageViewer(draft.receipt));
        } else {
          receiptPreview.innerHTML = '<div class="receipt-empty">' + icon('receipt') + '<span>还没有上传支付清单</span></div>';
          receiptRemove.classList.add('hidden');
        }
      }
      backdrop.querySelector('#receiptPick').addEventListener('click', () => receiptInput.click());
      receiptInput.addEventListener('change', async () => {
        const file = receiptInput.files && receiptInput.files[0];
        receiptInput.value = '';
        if (!file) return;
        try {
          draft.receipt = await compressImageFile(file, 1200, 0.72, 900000);
          renderReceiptPreview();
          toast('支付清单已准备好，保存后生效');
        } catch (err) {
          toast(err.message || '图片处理失败', 'error');
        }
      });
      receiptRemove.addEventListener('click', () => {
        draft.receipt = '';
        renderReceiptPreview();
      });
      renderReceiptPreview();

      function setAmountPreview() {
        const raw = amountInput.value.trim();
        const cents = parseAmountExpression(raw);
        preview.textContent = raw && Number.isFinite(cents) && cents > 0 ? '= ' + money(cents) : '';
        amountError.textContent = '';
        updateSplitPreview();
      }
      function insertCalc(value) {
        const start = amountInput.selectionStart == null ? amountInput.value.length : amountInput.selectionStart;
        const end = amountInput.selectionEnd == null ? amountInput.value.length : amountInput.selectionEnd;
        amountInput.setRangeText(value, start, end, 'end');
        amountInput.focus();
        setAmountPreview();
      }
      backdrop.querySelectorAll('[data-calc]').forEach(btn => {
        btn.addEventListener('click', () => insertCalc(btn.dataset.calc));
      });
      const backBtn = backdrop.querySelector('[data-calc-back]');
      backBtn.addEventListener('click', () => {
        const start = amountInput.selectionStart == null ? amountInput.value.length : amountInput.selectionStart;
        const end = amountInput.selectionEnd == null ? amountInput.value.length : amountInput.selectionEnd;
        if (start !== end) amountInput.setRangeText('', start, end, 'end');
        else if (start > 0) amountInput.setRangeText('', start - 1, start, 'end');
        amountInput.focus();
        setAmountPreview();
      });
      amountInput.addEventListener('input', setAmountPreview);

      function renderSubchips() {
        const subs = projectSubs(project, draft.category);
        subWrap.innerHTML = subs.map(sub =>
          '<button type="button" class="subchip ' + (sub === draft.subcategory ? 'on' : '') + '" data-sub="' + esc(sub) + '">' + esc(sub) + '</button>'
        ).join('');
        subWrap.querySelectorAll('[data-sub]').forEach(btn => {
          btn.addEventListener('click', () => {
            draft.subcategory = btn.dataset.sub;
            renderSubchips();
          });
        });
      }
      function renderPayerChips() {
        payerSelect.innerHTML = payerChipsHTML(project, draft);
        payerSelect.querySelectorAll('[data-payer]').forEach(btn => {
          btn.addEventListener('click', () => {
            draft.payerId = btn.dataset.payer;
            if (draft.payerId === EXTERNAL_PAYER_ID) draft.splitMode = 'none';
            renderPayerChips();
            renderSplitArea();
          });
        });
      }
      backdrop.querySelectorAll('#catPicker [data-cat]').forEach(btn => {
        btn.addEventListener('click', () => {
          draft.category = btn.dataset.cat;
          draft.subcategory = projectSubs(project, draft.category)[0];
          backdrop.querySelectorAll('#catPicker [data-cat]').forEach(b => b.classList.toggle('on', b === btn));
          renderSubchips();
        });
      });

      function renderSplitArea() {
        splitArea.innerHTML = splitAreaHTML(draft, project);
        const modeButtons = splitArea.querySelectorAll('[data-split]');
        modeButtons.forEach(btn => {
          btn.addEventListener('click', () => {
            const next = btn.dataset.split;
            const wasPersonal = draft.splitMode === 'personal';
            if (next === draft.splitMode) return;
            draft.splitMode = next;
            if (next === 'personal') {
              const first = Array.from(draft.participants)[0] || draft.payerId || project.members[0].id;
              draft.participants = new Set([first]);
            } else if (wasPersonal) {
              // 离开“个人承担”时恢复全员，避免只留下一个人却仍显示“均分”。
              draft.participants = new Set(project.members.map(m => m.id));
              project.members.forEach(m => { if (!(Number(draft.weights[m.id]) > 0)) draft.weights[m.id] = 1; });
            }
            renderSplitArea();
          });
        });
        splitArea.querySelectorAll('[data-part]').forEach(btn => {
          btn.addEventListener('click', () => {
            const id = btn.dataset.part;
            if (draft.splitMode === 'personal') {
              draft.participants = new Set([id]);
            } else if (draft.participants.has(id)) {
              if (draft.participants.size <= 1) { toast('至少保留一位分摊成员', 'warn'); return; }
              draft.participants.delete(id);
            } else {
              draft.participants.add(id);
              if (!(Number(draft.weights[id]) > 0)) draft.weights[id] = 1;
            }
            renderSplitArea();
          });
        });
        const allBtn = splitArea.querySelector('#splitAll');
        if (allBtn) allBtn.addEventListener('click', () => {
          draft.participants = new Set(project.members.map(m => m.id));
          project.members.forEach(m => { if (!(Number(draft.weights[m.id]) > 0)) draft.weights[m.id] = 1; });
          renderSplitArea();
        });
        const clearBtn = splitArea.querySelector('#splitClear');
        if (clearBtn) clearBtn.addEventListener('click', () => {
          if (draft.splitMode === 'personal') return;
          draft.participants = new Set();
          renderSplitArea();
        });
        splitArea.querySelectorAll('.weight-input').forEach(input => {
          input.addEventListener('input', () => {
            const id = input.dataset.weightId;
            const value = Number(input.value.replace(',', '.'));
            if (Number.isFinite(value) && value > 0) draft.weights[id] = value;
            else delete draft.weights[id];
            updateSplitPreview();
          });
        });
        splitArea.querySelectorAll('.custom-input').forEach(input => {
          input.addEventListener('input', () => {
            const id = input.dataset.customId;
            const raw = input.value.trim();
            const cents = raw ? parseAmountExpression(raw) : 0;
            if (Number.isFinite(cents)) draft.customCents[id] = cents;
            else delete draft.customCents[id];
            updateSplitPreview();
          });
        });
        const fillBtn = splitArea.querySelector('#fillEqual');
        if (fillBtn) fillBtn.addEventListener('click', () => {
          const total = parseAmountExpression(amountInput.value);
          const ids = Array.from(draft.participants);
          if (!Number.isFinite(total) || total <= 0 || !ids.length) { toast('请先填写金额和分摊成员', 'warn'); return; }
          const shares = splitEqualCents(total, ids);
          draft.customCents = {};
          splitArea.querySelectorAll('.custom-input').forEach(input => {
            const id = input.dataset.customId;
            draft.customCents[id] = shares[id] || 0;
            input.value = centsToInput(shares[id] || 0);
          });
          updateSplitPreview();
        });
        updateSplitPreview();
      }

      function updateSplitPreview() {
        const amountCents = parseAmountExpression(amountInput.value);
        const summary = splitArea.querySelector('#sharePreviewText');
        const ids = Array.from(draft.participants);
        if (draft.splitMode === 'none') return;
        if (draft.splitMode === 'personal') {
          const m = findMember(project, ids[0]);
          if (summary) summary.textContent = m ? m.name + ' 个人承担' : '请选择成员';
          return;
        }
        if (!ids.length) {
          if (summary) summary.textContent = '请选择分摊成员';
          return;
        }
        if (!Number.isFinite(amountCents) || amountCents <= 0) {
          if (summary) summary.textContent = '填写金额后显示';
          return;
        }
        if (draft.splitMode === 'equal') {
          if (ids.length === 1) {
            const member = findMember(project, ids[0]);
            if (summary) summary.textContent = (member ? member.name : '1 人') + ' 承担全额';
          } else {
            const each = Math.floor(amountCents / ids.length);
            if (summary) summary.textContent = ids.length + ' 人 · 每人约 ' + money(each);
          }
        } else if (draft.splitMode === 'weights') {
          const weights = {};
          ids.forEach(id => {
            const input = splitArea.querySelector('.weight-input[data-weight-id="' + id + '"]');
            const val = input ? Number(input.value.replace(',', '.')) : Number(draft.weights[id] || 1);
            weights[id] = Number.isFinite(val) && val > 0 ? val : 1;
          });
          const shares = splitWeightedCents(amountCents, ids, weights);
          ids.forEach(id => {
            const label = splitArea.querySelector('.weight-share[data-share-id="' + id + '"]');
            if (label) label.textContent = '≈ ' + money(shares[id] || 0);
          });
          const totalWeight = ids.reduce((sum, id) => sum + weights[id], 0);
          if (summary) summary.textContent = '共 ' + totalWeight + ' 份 · 按份数比例';
        } else if (draft.splitMode === 'amounts') {
          let sum = 0, invalid = false;
          ids.forEach(id => {
            const input = splitArea.querySelector('.custom-input[data-custom-id="' + id + '"]');
            const raw = input ? input.value.trim() : '';
            const cents = input ? (raw ? parseAmountExpression(raw) : 0) : (draft.customCents[id] || 0);
            if (!Number.isFinite(cents)) invalid = true;
            else sum += cents;
          });
          const diff = amountCents - sum;
          const remainEl = splitArea.querySelector('#remainLine');
          if (remainEl) {
            remainEl.classList.toggle('over', invalid || diff !== 0);
            remainEl.innerHTML = '<span>已分配 ' + money(sum) + ' / ' + money(amountCents) + '</span><strong>' +
              (invalid ? '有金额格式错误' : diff === 0 ? '刚好分完' : diff > 0 ? '还差 ' + money(diff) : '超出 ' + money(-diff)) + '</strong>';
          }
          if (summary) summary.textContent = '逐人指定金额';
        }
      }

      renderSubchips();
      renderPayerChips();
      renderSplitArea();
      setAmountPreview();

      form.addEventListener('submit', event => {
        event.preventDefault();
        errorBox.innerHTML = '';
        amountError.textContent = '';
        const amountCents = parseAmountExpression(amountInput.value);
        if (!Number.isFinite(amountCents) || amountCents <= 0) {
          showAmountError('请输入大于 0 的金额，或有效的算式');
          amountInput.focus();
          return;
        }
        if (amountCents > 1000000000) {
          showAmountError('金额过大，请检查是否输入有误');
          return;
        }
        const date = backdrop.querySelector('#expDate').value;
        if (!parseISO(date)) { showExpenseError('请选择有效日期'); return; }
        const detail = backdrop.querySelector('#expDetail').value.trim();
        const note = backdrop.querySelector('#expNote').value.trim();
        const amountExpression = amountInput.value.trim().slice(0, 80);
        if (draft.payerId !== EXTERNAL_PAYER_ID && !findMember(project, draft.payerId)) { showExpenseError('请选择暂付款方'); return; }
        let participants = Array.from(draft.participants);
        if (draft.splitMode === 'personal') {
          participants = participants.slice(0, 1);
          if (!participants.length) { showExpenseError('请选择由谁承担这笔费用'); return; }
        } else if (draft.splitMode !== 'none' && !participants.length) {
          showExpenseError('请至少选择一位分摊成员');
          return;
        }
        const weights = {};
        const customCents = {};
        if (draft.splitMode === 'weights') {
          let valid = true;
          splitArea.querySelectorAll('.weight-input').forEach(input => {
            const id = input.dataset.weightId;
            if (!participants.includes(id)) return;
            const value = Number(input.value.replace(',', '.'));
            if (!Number.isFinite(value) || value <= 0 || value > 10000) valid = false;
            else weights[id] = value;
          });
          if (!valid || participants.some(id => !weights[id])) {
            showExpenseError('按份数分摊时，每位成员的份数需大于 0 且不超过 10000');
            return;
          }
        }
        if (draft.splitMode === 'amounts') {
          let sum = 0, valid = true;
          splitArea.querySelectorAll('.custom-input').forEach(input => {
            const id = input.dataset.customId;
            if (!participants.includes(id)) return;
            const raw = input.value.trim();
            const cents = raw ? parseAmountExpression(raw) : 0;
            if (!Number.isFinite(cents)) valid = false;
            else { customCents[id] = cents; sum += cents; }
          });
          if (!valid) { showExpenseError('指定金额的格式不正确'); return; }
          if (sum !== amountCents) {
            const diff = amountCents - sum;
            showExpenseError('指定金额合计需要等于总额，目前' +
              (diff > 0 ? '还差 ' + money(diff) : '超出 ' + money(-diff)));
            return;
          }
        }
        const payload = {
          id: existing ? existing.id : uid('e'),
          date,
          payerId: draft.payerId,
          category: draft.category,
          subcategory: draft.subcategory,
          title: '',
          detail: detail.slice(0, 200),
          amountExpression,
          amountCents,
          splitMode: draft.splitMode,
          participants,
          weights: draft.splitMode === 'weights' ? weights : {},
          customCents: draft.splitMode === 'amounts' ? customCents : {},
          note,
          receipt: draft.receipt || '',
          settled: existing ? existing.settled === true : false,
          createdAt: existing ? existing.createdAt : nowISO()
        };
        if (existing) {
          const idx = project.expenses.findIndex(e => e.id === existing.id);
          if (idx >= 0) project.expenses[idx] = payload;
        } else {
          project.expenses.push(payload);
        }
        touchProject(project);
        const persisted = saveDB();
        closeSheet();
        renderApp();
        if (!persisted) return;
        const overLimit = project.limits.find(l => {
          if (l.category !== 'total' && l.category !== payload.category) return false;
          return limitUsage(project, l).over;
        });
        if (overLimit) toast('已保存；「' + limitTitle(overLimit) + '」已超过限额', 'warn');
        else toast(isEdit ? '账目已更新' : '账目已记下');
      });

      const deleteBtn = backdrop.querySelector('#expDelete');
      if (deleteBtn) {
        deleteBtn.addEventListener('click', async () => {
          const ok = await confirmDialog({
            title: '删除这笔账目？',
            message: '「' + (existing.title || existing.subcategory) + '」' + money(existing.amountCents) + '，删除后无法恢复。',
            okText: '删除',
            danger: true
          });
          if (!ok) return;
          project.expenses = project.expenses.filter(e => e.id !== existing.id);
          touchProject(project);
          saveDB();
          closeSheet();
          renderApp();
          toast('账目已删除');
        });
      }
    }
  });
}

function payerChipsHTML(project, draft) {
  const memberChips = project.members.map(m =>
    '<button type="button" class="member-chip payer-member-chip ' + (m.id === draft.payerId ? 'on' : '') + '" data-payer="' + esc(m.id) + '" aria-label="' + esc(m.name) + '" title="' + esc(m.name) + '">' +
      memberAvatar(m) + (m.id === draft.payerId ? icon('check', 'sm tick') : '') + '</button>'
  ).join('');
  const external = '<button type="button" class="member-chip external-chip ' + (draft.payerId === EXTERNAL_PAYER_ID ? 'on' : '') + '" data-payer="' + EXTERNAL_PAYER_ID + '">' +
    '<span class="avatar avatar-external">其</span><span class="external-label">其他</span>' +
    (draft.payerId === EXTERNAL_PAYER_ID ? icon('check', 'sm tick') : '') + '</button>';
  return memberChips + external;
}

function splitAreaHTML(draft, project) {
  const ids = Array.from(draft.participants);
  const modeButtons = [['equal', '均分'], ['weights', '按份数'], ['amounts', '指定金额'], ['personal', '个人承担'], ['none', '无需分摊']].map(([key, label]) =>
    '<button type="button" class="seg-btn ' + (draft.splitMode === key ? 'on' : '') + '" data-split="' + key + '">' + label + '</button>'
  ).join('');
  const memberChips = project.members.map(m =>
    '<button type="button" class="member-chip payer-member-chip ' + (draft.participants.has(m.id) ? 'on' : '') + '" data-part="' + esc(m.id) + '" aria-label="' + esc(m.name) + '" title="' + esc(m.name) + '">' +
      memberAvatar(m) + (draft.participants.has(m.id) ? icon('check', 'sm tick') : '') + '</button>'
  ).join('');
  let detail = '';
  if (draft.splitMode === 'equal') {
    const n = ids.length;
    const onlyMember = n === 1 ? findMember(project, ids[0]) : null;
    detail = '<div class="share-preview"><span>' + (n === 1
      ? (onlyMember ? onlyMember.name + ' 承担全额' : '1 人承担全额')
      : (n ? n + ' 人平均分摊 · 余数自动分配到分' : '请选择成员')) + '</span>' +
      '<strong id="sharePreviewText">填写金额后显示</strong></div>';
  } else if (draft.splitMode === 'weights') {
    detail = '<div class="weight-list">' + ids.map(id => {
      const m = findMember(project, id);
      return '<div class="weight-row">' + memberAvatar(m, 'sm') + '<span class="weight-name">' + esc(m ? m.name : '成员') + '</span>' +
        '<input class="weight-input" inputmode="decimal" data-weight-id="' + esc(id) + '" value="' + esc(Number(draft.weights[id] || 1)) + '" aria-label="' + esc((m ? m.name : '') + '的份数') + '">' +
        '<span class="weight-unit">份</span><span class="weight-share" data-share-id="' + esc(id) + '">≈ ¥0</span></div>';
    }).join('') + '</div>' +
      '<div class="share-preview"><span>按份数比例分配，可填 0.5 份</span><strong id="sharePreviewText">—</strong></div>';
  } else if (draft.splitMode === 'amounts') {
    detail = '<div class="custom-list">' + ids.map(id => {
      const m = findMember(project, id);
      const cents = draft.customCents[id];
      return '<div class="custom-row">' + memberAvatar(m, 'sm') + '<span class="custom-name">' + esc(m ? m.name : '成员') + '</span>' +
        '<input class="custom-input" inputmode="decimal" data-custom-id="' + esc(id) + '" value="' + (cents ? esc(centsToInput(cents)) : '') + '" placeholder="0" aria-label="' + esc((m ? m.name : '') + '的金额') + '">' +
        '<span class="custom-unit">元</span></div>';
    }).join('') + '</div>' +
      '<div class="remain-line" id="remainLine"><span>已分配 ¥0</span><strong>还差</strong></div>' +
      '<div class="share-preview"><span>每个人承担的具体金额</span><button type="button" class="btn-link" id="fillEqual">按人均填充</button><strong id="sharePreviewText">逐人指定金额</strong></div>';
  } else if (draft.splitMode === 'none') {
    detail = '<div class="share-preview"><span>这笔费用不需要任何成员分摊</span><strong>每人 0 元</strong></div>';
  } else {
    detail = '<div class="share-preview"><span>整笔费用只算在一位成员头上</span><strong id="sharePreviewText">请选择成员</strong></div>';
  }
  const showMembers = draft.splitMode !== 'none';
  const action = draft.splitMode === 'personal'
    ? '<span class="stats-card-note">个人消费</span>'
    : (draft.splitMode === 'none' ? '<span class="stats-card-note">无需分摊</span>'
      : '<div class="split-actions"><button type="button" id="splitAll">全选</button><button type="button" id="splitClear">清空</button></div>');
  return '<div class="split-head"><span class="split-title">如何分摊</span>' + action + '</div>' +
    '<div class="segmented five" style="margin-bottom:11px">' + modeButtons + '</div>' +
    (showMembers
      ? '<div class="field-label" style="margin-bottom:5px">' + (draft.splitMode === 'personal' ? '由谁承担' : '参与分摊') + '</div>' +
        '<div class="member-select">' + memberChips + '</div>'
      : '') + detail +
    '<p class="field-hint" style="margin-top:8px">暂付款方选「其他」时默认无需分摊；选成员支付时，可正常分摊。</p>';
}

/* ---------- 启动 ---------- */
document.addEventListener('click', event => {
  const target = event.target && event.target.closest ? event.target.closest('[data-action]') : null;
  if (!target) return;
  const action = target.dataset.action;
  if (!action) return;
  event.preventDefault();
  Promise.resolve(handleAction(action, target)).catch(err => {
    console.error(err);
    toast('操作没有完成，请重试', 'error');
  });
});

window.addEventListener('hashchange', () => {
  if (activeSheet) closeSheet();
  renderApp();
  window.scrollTo(0, 0);
});

// 同一浏览器另一个标签页写入数据时，刷新当前页，避免用旧快照覆盖新账目。
window.addEventListener('storage', event => {
  if (event.key !== APP_KEY) return;
  db = loadDB();
  storageFailed = false;
  hideStorageWarning();
  applyAppearance();
  if (activeSheet) closeSheet();
  currentProjectId = null;
  renderApp();
  toast('检测到另一个页面更新了数据，已同步刷新', 'warn');
});

document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && activeSheet && !document.querySelector('.dialog-backdrop')) {
    closeSheet();
  }
});

function installTouchIcon() {
  try {
    const canvas = document.createElement('canvas');
    canvas.width = 180;
    canvas.height = 180;
    const ctx = canvas.getContext('2d');
    if (!ctx) return;
    const radius = 40;
    ctx.beginPath();
    ctx.moveTo(radius, 0);
    ctx.arcTo(180, 0, 180, 180, radius);
    ctx.arcTo(180, 180, 0, 180, radius);
    ctx.arcTo(0, 180, 0, 0, radius);
    ctx.arcTo(0, 0, 180, 0, radius);
    ctx.closePath();
    const bg = ctx.createLinearGradient(0, 0, 180, 180);
    bg.addColorStop(0, '#70587f');
    bg.addColorStop(1, '#3f304c');
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.strokeStyle = 'rgba(248,242,229,.14)';
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(148, 28, 48, 0, Math.PI * 2); ctx.stroke();
    ctx.save();
    ctx.scale(180 / 512, 180 / 512);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    const traceS = () => {
      ctx.beginPath();
      ctx.moveTo(415, 190);
      ctx.bezierCurveTo(408, 122, 337, 82, 255, 88);
      ctx.bezierCurveTo(166, 94, 98, 157, 112, 225);
      ctx.bezierCurveTo(124, 286, 205, 307, 268, 304);
      ctx.bezierCurveTo(344, 300, 413, 323, 414, 382);
      ctx.bezierCurveTo(415, 451, 333, 490, 250, 490);
      ctx.bezierCurveTo(180, 490, 120, 458, 96, 410);
    };
    ctx.strokeStyle = 'rgba(248,237,223,.45)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(338, 123); ctx.lineTo(500, 103);
    ctx.moveTo(336, 145); ctx.lineTo(500, 126);
    ctx.moveTo(12, 430); ctx.lineTo(248, 454);
    ctx.moveTo(12, 452); ctx.lineTo(244, 476);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(248,237,223,.07)';
    ctx.lineWidth = 84; traceS(); ctx.stroke();
    ctx.strokeStyle = 'rgba(248,237,223,.10)';
    ctx.lineWidth = 76; traceS(); ctx.stroke();
    ctx.strokeStyle = 'rgba(248,237,223,.15)';
    ctx.lineWidth = 68; traceS(); ctx.stroke();
    ctx.strokeStyle = 'rgba(248,237,223,.24)';
    ctx.lineWidth = 60; traceS(); ctx.stroke();
    ctx.strokeStyle = '#f7ead8';
    ctx.lineWidth = 52; traceS(); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,253,247,.45)';
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.moveTo(390, 156);
    ctx.bezierCurveTo(367, 117, 312, 99, 260, 104);
    ctx.stroke();
    ctx.fillStyle = 'rgba(248,237,223,.55)';
    ctx.beginPath(); ctx.arc(100, 96, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(248,237,223,.3)';
    ctx.beginPath(); ctx.arc(80, 73, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    const link = document.createElement('link');
    link.rel = 'apple-touch-icon';
    link.setAttribute('sizes', '180x180');
    link.href = canvas.toDataURL('image/png');
    document.head.appendChild(link);
  } catch (_) { /* 图标生成失败不影响记账 */ }
}

(function boot() {
  if (!location.hash) {
    try { history.replaceState(null, '', '#/'); } catch (_) { /* file:// 下可能不允许 */ }
  }
  installTouchIcon();
  applyAppearance();
  renderApp();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => { /* 本地预览或权限受限时忽略 */ });
    });
  }
})();
</script>
