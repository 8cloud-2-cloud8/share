function normalizeProject(raw) {
  const p = raw && typeof raw === 'object' ? raw : {};
  let members = Array.isArray(p.members) ? p.members.slice(0, 10).map((m, i) => {
    const item = m && typeof m === 'object' ? m : {};
    return {
      id: safeId(item.id, 'm'),
      name: String(item.name || '成员').trim().slice(0, 20) || '成员',
      code: String(item.code || '').trim().slice(0, 2).toUpperCase(),
      color: /^#[0-9a-f]{6}$/i.test(String(item.color || '')) ? String(item.color).toLowerCase() : ALL_MEMBER_COLORS[i % ALL_MEMBER_COLORS.length]
    };
  }) : [];
  if (members.length === 0) {
    members = [makeMember('我', MEMBER_COLORS[0], null, 'A'), makeMember('旅伴', MEMBER_COLORS[1], null, 'B')];
  } else if (members.length === 1) {
    members.push(makeMember('旅伴', MEMBER_COLORS[1], null, 'B'));
  }
  const memberIds = new Set(members.map(m => m.id));
  const startDate = parseISO(p.startDate) ? p.startDate : todayISO();
  let endDate = parseISO(p.endDate) ? p.endDate : addDaysISO(startDate, 2);
  if (endDate < startDate) endDate = startDate;
  const subcategories = normalizeSubcategories(p.subcategories);
  const expenses = (Array.isArray(p.expenses) ? p.expenses : []).map((rawExp, index) => normalizeExpense(rawExp, members, memberIds, startDate, index, subcategories));
  const limits = (Array.isArray(p.limits) ? p.limits : []).map(normalizeLimit).filter(Boolean);
  const budgets = normalizeBudgets(p.budgets);
  const settlements = (Array.isArray(p.settlements) ? p.settlements : []).map(normalizeSettlement).filter(Boolean);
  // 以结算记录为唯一依据恢复“已结清”状态，避免导入残缺数据后账目被永久锁死。
  const settledIds = new Set();
  settlements.forEach(s => s.expenseIds.forEach(id => settledIds.add(id)));
  expenses.forEach(e => { e.settled = settledIds.has(e.id); });
  return {
    id: safeId(p.id, 'p'),
    name: String(p.name || '未命名行程').trim().slice(0, 40) || '未命名行程',
    startDate,
    endDate,
    note: String(p.note || '').slice(0, 300),
    members,
    subcategories,
    expenses,
    limits,
    budgets,
    settlements,
    createdAt: p.createdAt || nowISO(),
    updatedAt: p.updatedAt || nowISO()
  };
}

function normalizeExpense(raw, members, memberIds, fallbackDate, index, subcategories) {
  const e = raw && typeof raw === 'object' ? raw : {};
  const category = CATEGORIES[e.category] ? e.category : 'other';
  const subs = (subcategories && Array.isArray(subcategories[category]) && subcategories[category].length)
    ? subcategories[category]
    : CATEGORIES[category].subs;
  const participants = Array.isArray(e.participants)
    ? Array.from(new Set(e.participants.map(String).filter(id => memberIds.has(id))))
    : [];
  if (participants.length === 0) members.forEach(m => participants.push(m.id));
  let amountCents = Number(e.amountCents);
  if (!Number.isFinite(amountCents)) amountCents = Math.round(Number(e.amount || 0) * 100);
  amountCents = Math.max(0, Math.round(amountCents));
  const weights = {};
  if (e.weights && typeof e.weights === 'object') {
    Object.keys(e.weights).forEach(id => {
      if (memberIds.has(id)) {
        const w = Number(e.weights[id]);
        if (Number.isFinite(w) && w > 0 && w <= 10000) weights[id] = w;
      }
    });
  }
  const customCents = {};
  if (e.customCents && typeof e.customCents === 'object') {
    Object.keys(e.customCents).forEach(id => {
      if (memberIds.has(id)) {
        const v = Number(e.customCents[id]);
        if (Number.isFinite(v) && v >= 0) customCents[id] = Math.round(v);
      }
    });
  }
  const payerId = String(e.payerId || '');
  const isExternal = payerId === EXTERNAL_PAYER_ID;
  return {
    id: safeId(e.id, 'e'),
    date: parseISO(e.date) ? e.date : fallbackDate,
    payerId: isExternal ? EXTERNAL_PAYER_ID : (memberIds.has(payerId) ? payerId : members[0].id),
    category,
    subcategory: subs.includes(e.subcategory) ? e.subcategory : subs[0],
    title: String(e.title || '').slice(0, 60),
    detail: String(e.detail || '').slice(0, 200),
    amountExpression: String(e.amountExpression || '').slice(0, 80),
    amountCents,
    splitMode: SPLIT_LABELS[e.splitMode] ? e.splitMode : 'equal',
    participants,
    weights,
    customCents,
    note: String(e.note || '').slice(0, 300),
    reimburseDate: parseISO(e.reimburseDate) ? e.reimburseDate : '',
    receipt: isImageDataUrl(e.receipt, 950000) ? e.receipt : '',
    settled: e.settled === true,
    createdAt: e.createdAt || new Date(Date.now() - index * 1000).toISOString()
  };
}

function normalizeBudgets(raw) {
  const source = raw && typeof raw === 'object' ? raw : {};
  const budgets = {};
  CAT_ORDER.forEach(key => {
    const cents = Math.round(Number(source[key]) || 0);
    if (Number.isFinite(cents) && cents > 0) budgets[key] = cents;

function normalizeLimit(raw) {

function normalizeSettlement(raw) {
  const s = raw && typeof raw === 'object' ? raw : null;
  if (!s) return null;
  const transfers = (Array.isArray(s.transfers) ? s.transfers : [])
    .filter(t => t && typeof t === 'object')

    })).filter(t => t.amountCents > 0);

    expenseIds: Array.isArray(s.expenseIds) ? s.expenseIds.map(String) : [],

  };
}

function getProject(id) {

function findExpense(project, id) {

  return project ? project.members.find(m => m.id === id) || null : null;

function touchProject(project) {
  if (project) project.updatedAt = nowISO();

function splitEqualCents(total, ids) {
  const n = ids.length;
  if (!n) return {};
  const base = Math.floor(total / n);
  let remainder = total - base * n;
  const shares = {};
  ids.forEach((id, i) => {
    shares[id] = base + (i < remainder ? 1 : 0);
  });
  return shares;
}

function splitWeightedCents(total, ids, weights) {
  const valid = ids.filter(id => {
    const w = Number(weights[id]);
    return Number.isFinite(w) && w > 0 && w <= 10000;
  });
  if (!valid.length) return splitEqualCents(total, ids);
  const sumWeights = valid.reduce((sum, id) => sum + Number(weights[id]), 0);
  if (!Number.isFinite(sumWeights) || !sumWeights) return splitEqualCents(total, ids);
  const rows = valid.map((id, i) => {
    const exact = total * Number(weights[id]) / sumWeights;
    const base = Math.floor(exact);
    return { id, base, frac: exact - base, order: i };
  });
  let remainder = total - rows.reduce((sum, row) => sum + row.base, 0);
  rows.sort((a, b) => (b.frac - a.frac) || (a.order - b.order));
  for (let i = 0; i < rows.length && remainder > 0; i++) {
    rows[i].base += 1;
    remainder -= 1;
  }
  const shares = {};
  rows.forEach(row => { shares[row.id] = row.base; });
  ids.forEach(id => { if (!(id in shares)) shares[id] = 0; });
  return shares;
}

function computeExpenseShares(project, expense) {
  const zero = {};
  project.members.forEach(m => { zero[m.id] = 0; });
  if (expense.splitMode === 'none' || expense.payerId === EXTERNAL_PAYER_ID) return zero;
  const total = Math.max(0, Math.round(expense.amountCents || 0));
  let ids = (expense.participants || []).filter(id => findMember(project, id));
  if (!ids.length) ids = project.members.map(m => m.id);
  if (expense.splitMode === 'personal') {
    const id = ids[0] || project.members[0].id;
    const shares = {};
    project.members.forEach(m => { shares[m.id] = 0; });
    shares[id] = total;
    return shares;
  }
  let shares;
  if (expense.splitMode === 'weights') {
    shares = splitWeightedCents(total, ids, expense.weights || {});
  } else if (expense.splitMode === 'amounts') {
    const custom = expense.customCents || {};
    const sum = ids.reduce((s, id) => s + Math.max(0, Math.round(Number(custom[id]) || 0)), 0);
    if (sum === total) {
      shares = {};
      ids.forEach(id => { shares[id] = Math.max(0, Math.round(Number(custom[id]) || 0)); });
    } else {
      shares = splitEqualCents(total, ids);
    }
  } else {
    shares = splitEqualCents(total, ids);
  }
  const normalized = {};
  project.members.forEach(m => { normalized[m.id] = shares[m.id] || 0; });
  return normalized;
}

function computeMemberTotals(project, expenseList) {
  const list = expenseList || project.expenses;
  const map = {};
  project.members.forEach(m => {
    map[m.id] = { id: m.id, name: m.name, color: m.color, paidCents: 0, shareCents: 0, netCents: 0 };
  });
  list.forEach(exp => {
    if (map[exp.payerId]) map[exp.payerId].paidCents += exp.amountCents;
    const shares = computeExpenseShares(project, exp);
    Object.keys(shares).forEach(id => {
      if (map[id]) map[id].shareCents += shares[id];
    });
  });
  return project.members.map(m => {
    const row = map[m.id];
    row.netCents = row.paidCents - row.shareCents;
    return row;
  });
}

function computeProjectStats(project) {
  const expenses = project.expenses;
  const totalCents = expenses.reduce((sum, e) => sum + e.amountCents, 0);
  const unsettled = expenses.filter(e => !e.settled && needsSettlement(e));
  const unsettledCents = unsettled.reduce((sum, e) => sum + e.amountCents, 0);
  const pendingSummary = computeMemberTotals(project, unsettled);
  const pendingTransferCents = pendingSummary.reduce((sum, row) => sum + Math.max(0, row.netCents), 0);
  const byCategory = {};
  CAT_ORDER.forEach(key => { byCategory[key] = { cents: 0, count: 0 }; });
  expenses.forEach(e => {
    byCategory[e.category].cents += e.amountCents;
    byCategory[e.category].count += 1;
  });
  const memberCount = Math.max(1, project.members.length);
  return {
    totalCents,
    avgCents: Math.round(totalCents / memberCount),
    expenseCount: expenses.length,
    unsettledCents,
    unsettledCount: unsettled.length,
    pendingTransferCents,
    byCategory
  };
}

function computeTransfers(summary) {
  const creditors = summary
    .filter(row => row.netCents > 0)
    .map((row, i) => ({ id: row.id, name: row.name, amountCents: row.netCents, order: i }))
    .sort((a, b) => (b.amountCents - a.amountCents) || (a.order - b.order));
  const debtors = summary
    .filter(row => row.netCents < 0)
    .map((row, i) => ({ id: row.id, name: row.name, amountCents: -row.netCents, order: i }))
    .sort((a, b) => (b.amountCents - a.amountCents) || (a.order - b.order));
  const transfers = [];
  let ci = 0, di = 0;
  let guard = 0;
  while (ci < creditors.length && di < debtors.length && guard < 100) {
    guard++;
    const creditor = creditors[ci];
    const debtor = debtors[di];
    const amount = Math.min(creditor.amountCents, debtor.amountCents);
    if (amount > 0) {
      transfers.push({
        fromId: debtor.id, fromName: debtor.name,
        toId: creditor.id, toName: creditor.name,
        amountCents: amount
      });
    }
    creditor.amountCents -= amount;
    debtor.amountCents -= amount;
    if (creditor.amountCents <= 0) ci++;
    if (debtor.amountCents <= 0) di++;
  }
  return transfers;
}

function limitUsage(project, limit) {
  const list = project.expenses.filter(e => limit.category === 'total' || e.category === limit.category);
  const perPersonTotal = {};
  const perPersonDay = {};
  const groupDay = {};
  list.forEach(exp => {
    const shares = computeExpenseShares(project, exp);
    project.members.forEach(m => {
      const cents = shares[m.id] || 0;
      if (cents > 0) {
        perPersonTotal[m.id] = (perPersonTotal[m.id] || 0) + cents;
        const key = m.id + '\u0000' + exp.date;
        perPersonDay[key] = (perPersonDay[key] || 0) + cents;
      }
    });
    groupDay[exp.date] = (groupDay[exp.date] || 0) + exp.amountCents;
  });

  let spentCents = 0;
  let extra = '暂无支出';
  let peakDate = '';
  let peakMemberId = '';
  let daysOver = 0;

  if (limit.period === 'trip') {
    if (limit.scope === 'person') {
      Object.keys(perPersonTotal).forEach(id => {
        if (perPersonTotal[id] > spentCents) {
          spentCents = perPersonTotal[id];
          peakMemberId = id;
        }
      });
      if (peakMemberId) {
        const member = findMember(project, peakMemberId);
        extra = '最高成员 ' + (member ? member.name : '') + ' 全程';
      }
    } else {
      spentCents = list.reduce((sum, e) => sum + e.amountCents, 0);
      extra = '全组全程累计';
    }
  } else {
    if (limit.scope === 'person') {
      const overDates = new Set();
      Object.keys(perPersonDay).forEach(key => {
        const parts = key.split('\u0000');
        const id = parts[0];
        const date = parts[1];
        const cents = perPersonDay[key];
        if (cents > spentCents) {
          spentCents = cents;
          peakDate = date;
          peakMemberId = id;
        }
        if (cents > limit.amountCents) overDates.add(date);
      });
      if (peakDate) {
        const member = findMember(project, peakMemberId);
        extra = '最高 ' + (member ? member.name : '') + ' · ' + shortDateLabel(peakDate);
      }
      daysOver = overDates.size;
    } else {
      Object.keys(groupDay).forEach(date => {
        if (groupDay[date] > spentCents) {
          spentCents = groupDay[date];
          peakDate = date;
        }
        if (groupDay[date] > limit.amountCents) daysOver++;
      });
      if (peakDate) extra = '最高单日 ' + shortDateLabel(peakDate);
    }
  }

  const pct = limit.amountCents > 0 ? spentCents / limit.amountCents * 100 : 0;
  return {
    spentCents,
    pct,
    over: spentCents > limit.amountCents,
    remainingCents: limit.amountCents - spentCents,
    extra,
    memberCount: project.members.length,
    daysOver
  };
}

function limitTitle(limit) {
  const cat = limit.category === 'total' ? '总支出' : catMeta(limit.category).label;
  return cat + ' · ' + (limit.period === 'day' ? '每天' : '全程') + ' · ' + (limit.scope === 'person' ? '每人' : '全组');
}

/* ---------- 通用渲染片段 ---------- */
function sortExpenses(list) {
  return list.slice().sort((a, b) => {
    const byDate = String(b.date).localeCompare(String(a.date));
    if (byDate !== 0) return byDate;
    return String(b.createdAt).localeCompare(String(a.createdAt));
  });
}

function sortExpensesAsc(list) {
  return list.slice().sort((a, b) => {
    const byDate = String(a.date).localeCompare(String(b.date));
    if (byDate !== 0) return byDate;
    return String(a.createdAt).localeCompare(String(b.createdAt));
  });
}

function needsSettlement(expense) {
  return expense.payerId !== EXTERNAL_PAYER_ID && expense.splitMode !== 'none';
}

function tableSplitNote(project, expense) {
  const participants = expense.participants.map(id => findMember(project, id)).filter(Boolean);
  if (expense.splitMode === 'none') return expense.payerId === EXTERNAL_PAYER_ID ? '其他支付 · 无需分摊' : '无需分摊';
  if (expense.payerId === EXTERNAL_PAYER_ID) return '其他支付 · 无需分摊';
  if (expense.splitMode === 'personal') {
    const member = participants[0];
    return (member ? memberCode(member) : '—') + ' 个人';
  }
  if (expense.splitMode === 'weights') {
    const parts = expense.participants.map(id => {
      const member = findMember(project, id);
      const weight = Number(expense.weights[id]) || 0;
      return (member ? memberCode(member) : '?') + (Math.round(weight * 100) / 100);
    });
    return '份数 ' + parts.join(' / ');
  }
  if (expense.splitMode === 'amounts') return '指定金额';
  if (!participants.length) return '均分';
  if (participants.length === 1) return memberCode(participants[0]) + ' 全额';
  if (participants.length === project.members.length) return participants.length + ' 人均分';
  return participants.map(memberCode).join('、') + ' 均分';
}

function avatarStack(project, max = 4) {
  if (ui.privacyHidden) return '';
  const shown = project.members.slice(0, max);
  const rest = project.members.length - shown.length;
  return shown.map(m => memberAvatar(m, 'sm')).join('') +
    (rest > 0 ? '<span class="avatar avatar-more sm">+' + rest + '</span>' : '');
}

function splitSummary(project, expense) {
  const count = expense.participants.length;
  if (expense.splitMode === 'personal') {
    const member = findMember(project, expense.participants[0]);
    return (member ? member.name : '一人') + '个人承担';
  }
  if (expense.splitMode === 'weights') return count + '人按份数分摊';
  if (expense.splitMode === 'amounts') return count + '人按指定金额分摊';
  return count + '人均分';
}

  }

    ? '<colgroup><col style="width:30px"><col style="width:20px"><col style="width:32px"><col style="width:70px"><col style="width:36px">' +
      members.map(() => '<col style="width:30px">').join('') + '<col style="width:36px"></colgroup>'

      members.map(() => '<col style="width:' + memberPct + '%">').join('') + '<col style="width:11.5%"></colgroup>';

  const memberGrand = {};
  members.forEach(m => { memberGrand[m.id] = 0; });
  let grandTotal = 0;
  let body = '';
  CAT_ORDER.forEach(key => {
    const exps = sortExpensesAsc(all.filter(e => e.category === key));
    if (!exps.length) return;
    const cat = catMeta(key);
    const catShares = {};
    members.forEach(m => { catShares[m.id] = 0; });
    let catTotal = 0;
    const catRows = exps.length + 1;
    exps.forEach((exp, index) => {
      const shares = computeExpenseShares(project, exp);
      const external = exp.payerId === EXTERNAL_PAYER_ID;
      const noPayer = external || exp.splitMode === 'none';
      const payer = findMember(project, exp.payerId);
      const payerColor = payer ? payer.color : '';
      catTotal += exp.amountCents;
      members.forEach(m => {
        catShares[m.id] += shares[m.id] || 0;
        memberGrand[m.id] += shares[m.id] || 0;
      });
      const detailParts = [];
      if (exp.title && exp.title !== exp.subcategory) detailParts.push(exp.title);
      if (exp.detail) detailParts.push(exp.detail);
      let note = ui.privacyHidden ? (noPayer ? '无需分摊' : '已分摊') : esc(tableSplitNote(project, exp));
      if (exp.note) note += '<br><span class="exp-note-text">' + esc(exp.note) + '</span>';
      if (exp.settled) note += '<br><span class="settled-word">已结清</span>';
      const hidePayer = ui.privacyHidden;
      const payStyle = (noPayer || hidePayer) ? '' : 'background:' + esc(payerColor) + ';color:' + contrastText(payerColor);
      const categoryCell = index === 0
        ? '<th scope="rowgroup" rowspan="' + catRows + '" class="col-cat"><span class="exp-cat-inner"><span class="exp-cat-icon">' + icon(cat.icon) + '</span><span class="exp-cat-label">' + cat.label + '</span></span></th>'
        : '';
      body += '<tr class="exp-row ' + (index === 0 ? 'cat-first ' : '') + (exp.settled ? 'settled' : '') + '" data-action="open-expense-detail" data-id="' + esc(exp.id) + '" title="点按查看支付清单与完整分摊">' +
        categoryCell +
        '<td class="exp-time">' + (ui.privacyHidden ? '***' : shortDateDigits(exp.date)) + '</td>' +
        '<td class="exp-content">' + esc(exp.subcategory) + '</td>' +
        '<td class="exp-detail-cell">' + (detailParts.length ? esc(detailParts.join('；')) : '<span class="zero-amount">—</span>') +
          (exp.receipt ? '<span class="receipt-mini" title="有支付清单">' + icon('receipt') + '</span>' : '') + '</td>' +
        '<td class="pay-cell' + ((noPayer || hidePayer) ? ' no-payer' : '') + '"' + (payStyle ? ' style="' + payStyle + '"' : '') + ' title="暂付款方：' + esc(ui.privacyHidden ? '已隐藏' : (external ? '其他' : (payer ? payer.name : '未知'))) + '">' + tableMoney(exp.amountCents) + '</td>' +
        members.map(m => '<td class="member-amount">' + (shares[m.id] ? tableMoney(shares[m.id]) : '<span class="zero-amount">—</span>') + '</td>').join('') +
        '<td class="exp-note">' + note + '</td></tr>';
    });
    grandTotal += catTotal;
    body += '<tr class="subtotal-row"><td></td><td class="subtotal-word">小计</td><td></td>' +
      '<td class="subtotal-amount">' + tableMoney(catTotal) + '</td>' +
      members.map(m => '<td class="member-amount">' + (catShares[m.id] ? tableMoney(catShares[m.id]) : '—') + '</td>').join('') +
      '<td class="exp-note"></td></tr>';
  });
  const totalMemberCells = members.map(m => '<td class="member-amount">' + tableMoney(memberGrand[m.id]) + '</td>').join('');
  const totalRow = '<tr class="total-row"><td></td><td></td><td class="total-word">合计</td><td></td>' +
    '<td class="total-amount">' + tableMoney(grandTotal) + '</td>' +
    totalMemberCells + '<td class="exp-note">' + all.length + ' 笔</td></tr>';
  const pending = all.filter(exp => !exp.settled && needsSettlement(exp));
  const pendingSummary = computeMemberTotals(project, pending);
  const transferTotal = pendingSummary.reduce((sum, row) => sum + Math.max(0, row.netCents), 0);
  const transferCells = pendingSummary.map(row => {
    const cls = row.netCents > 0 ? 'pos' : row.netCents < 0 ? 'neg' : 'zero';
    const text = row.netCents > 0 ? '+' + tableMoney(row.netCents) : row.netCents < 0 ? tableMoney(row.netCents) : '—';
    return '<td class="transfer-net ' + cls + '">' + text + '</td>';
  }).join('');
  const transferRow = '<tr class="transfer-row" data-action="jump" data-target="settleSection" title="去下方结算区处理转账">' +
    '<td></td><td class="exp-time"></td><td class="transfer-word">转账</td><td class="exp-detail-cell transfer-label">应收+ / 应付−</td>' +
    '<td class="transfer-total">' + (pending.length ? tableMoney(transferTotal) : '0') + '</td>' +
    transferCells + '<td class="exp-note">' + (pending.length ? '待结清' : '已结清') + '</td></tr>';
  return topbar +
    '<div class="exp-table-card"><div class="exp-scroll"><table class="exp-table"' + (wide ? ' style="min-width:' + minWidth + 'px"' : '') + '>' + colgroup +
      '<thead><tr><th scope="col" class="col-cat">分类</th><th scope="col">时间</th><th scope="col">内容</th><th scope="col">明细</th><th scope="col">金额</th>' +
      headers + '<th scope="col">备注</th></tr></thead>' +
      '<tbody>' + body + '</tbody>' +
      '<tfoot>' + totalRow + transferRow + '</tfoot>' +
    '</table></div></div>' +
    '<p class="table-note">金额单位：元。内容 = 项，明细 = 具体说明；成员列 = 每人应摊；点任一行查看支付清单、完整内容和分摊方式。<br>金额格的底色为暂付款方的颜色，无需参与者支付时不显示底色。</p>';
}

function renderShareMatrix(project) {
  const members = project.members;
  if (!project.expenses.length) {
    return '<div class="matrix-card"><div class="matrix-empty">还没有账目。记下第一笔后，这里会按「大类 × 成员」自动汇总。</div></div>';
  }
  const rows = {};
  const memberTotals = {};
  CAT_ORDER.forEach(key => {
    rows[key] = { cells: {}, count: 0, total: 0 };
    members.forEach(m => { rows[key].cells[m.id] = 0; });
  });
  members.forEach(m => { memberTotals[m.id] = 0; });
  project.expenses.forEach(exp => {
    const row = rows[exp.category];
    const shares = computeExpenseShares(project, exp);
    row.count += 1;
    members.forEach(m => {
      const cents = shares[m.id] || 0;
      row.cells[m.id] += cents;
      row.total += cents;
      memberTotals[m.id] += cents;
    });
  });
  const grandTotal = CAT_ORDER.reduce((sum, key) => sum + rows[key].total, 0);
  const minWidth = 66 + members.length * 52 + 56;
  const memberHeads = members.map(m =>
    '<th scope="col"><span class="matrix-member">' + memberAvatar(m) + '<em>' + esc(m.name) + '</em></span></th>'
  ).join('');
  const body = CAT_ORDER.map(key => {
    const cat = catMeta(key);
    const row = rows[key];
    const cells = members.map(m => {
      const cents = row.cells[m.id] || 0;
      return '<td class="matrix-cell">' + (cents ? money(cents, false) : '<span class="matrix-zero">—</span>') + '</td>';
    }).join('');
    return '<tr><th scope="row" class="matrix-cat"><span class="matrix-cat-inner"><span class="matrix-cat-icon" style="' + catStyle(cat) + '">' + icon(cat.icon) + '</span>' +
      '<span><span class="matrix-cat-name">' + cat.label + '</span><span class="matrix-cat-count">' + row.count + ' 笔</span></span></span></th>' +
      cells + '<td class="matrix-rowtotal">' + money(row.total, false) + '</td></tr>';
  }).join('');
  const footCells = members.map(m =>
    '<td class="matrix-coltotal">' + money(memberTotals[m.id], false) + '</td>'
  ).join('');
  return '<div class="matrix-card"><div class="matrix-scroll"><table class="matrix" style="min-width:' + minWidth + 'px">' +
    '<thead><tr><th scope="col" class="matrix-corner">分类</th>' + memberHeads + '<th scope="col">合计</th></tr></thead>' +
    '<tbody>' + body + '</tbody>' +
    '<tfoot><tr><th scope="row" class="matrix-corner">合计</th>' + footCells + '<td class="matrix-grand">' + money(grandTotal, false) + '</td></tr></tfoot>' +
    '</table></div><p class="matrix-note">整趟账目里，每个人在每个大类下应承担的金额，含已结清；不按日期排列，也不含“谁转给谁”。转账方案在下方结算区，点「查看明细」可编辑单笔；人多或屏幕较窄时可左右滑动表格。</p></div>';
}

function openExpenseDetail(project, expense) {
  const cat = catMeta(expense.category);
  const payer = findMember(project, expense.payerId);
  const shares = computeExpenseShares(project, expense);
  const splitRows = ui.privacyHidden
    ? '<p class="help-text" style="margin:0">分摊成员已隐藏。</p>'
    : (expense.splitMode === 'none' || expense.payerId === EXTERNAL_PAYER_ID)
    ? '<p class="help-text" style="margin:0">无需任何成员分摊，每人 0 元。</p>'
    : expense.participants.map(id => {
      const member = findMember(project, id);
      if (!member) return '';
      const extra = expense.splitMode === 'weights' ? ' · ' + (Math.round((Number(expense.weights[id]) || 0) * 100) / 100) + ' 份' : '';
      return '<div class="split-item">' + memberAvatar(member) +
        '<span class="split-name">' + esc(member.name) + (extra ? ' <span style="color:var(--muted);font-size:9px">' + esc(extra) + '</span>' : '') + '</span>' +
        '<span class="split-money">' + money(shares[id] || 0, false) + ' 元</span></div>';
    }).join('');
  const external = expense.payerId === EXTERNAL_PAYER_ID;
  const infoRows = [
    ['实际发生', ui.privacyHidden ? '***' : dateLabel(expense.date, { weekday: true })],
    ['大类 / 项', cat.label + ' · ' + expense.subcategory],
    ...(expense.amountExpression ? [['金额计算', expense.amountExpression + ' = ' + money(expense.amountCents)]] : []),
    ['分摊方式', SPLIT_LABELS[expense.splitMode] + ' · ' + tableSplitNote(project, expense)],
    ['状态', expense.settled ? '已结清' : (needsSettlement(expense) ? '待结清' : '无需结算')]
  ].map(row => '<div class="detail-info-row"><span>' + row[0] + '</span><span>' + esc(row[1]) + '</span></div>').join('');
  const receiptHtml = expense.receipt
    ? '<div class="receipt-detail"><div class="field-label">支付清单</div><img class="receipt-thumb" src="' + expense.receipt + '" alt="支付清单">' +
      '<button type="button" class="receipt-open" id="detailReceiptOpen">查看大图</button></div>'
    : '<div class="receipt-detail"><div class="field-label">支付清单</div><p class="help-text" style="margin:0">这笔还没有上传支付清单。</p></div>';
  const body = '<div class="exp-detail-head"><div style="flex:1;min-width:0"><div class="big-amount">' + money(expense.amountCents) + '</div>' +
      '<div class="detail-sub">' + esc(expense.title || expense.subcategory) + ' · ' + shortDateLabel(expense.date) + '</div></div>' +
      '<span class="status-pill ' + (expense.settled ? 'done' : 'upcoming') + '"><span class="dot"></span>' + (expense.settled ? '已结清' : '待结清') + '</span></div>' +
    '<div class="payer-badge">' + (ui.privacyHidden ? '' : (external ? '<span class="avatar avatar-external">其</span>' : (payer ? memberAvatar(payer) : ''))) +
      '<span>暂付款方 · ' + esc(ui.privacyHidden ? '已隐藏' : (external ? '其他' : (payer ? payer.name : '未知'))) + '</span>' +
      '<span style="margin-left:auto;font-weight:750;color:var(--ink)">已付 ' + money(expense.amountCents) + '</span></div>' +
    '<div class="detail-info">' + infoRows + '</div>' +
    (expense.detail ? '<div class="detail-info"><div class="field-label">具体明细</div><div class="detail-note">' + esc(expense.detail) + '</div></div>' : '') +
    '<div class="detail-info"><div class="field-label">每人应摊</div><div class="split-list">' + (splitRows || '<p class="help-text" style="margin:0">没有分摊成员。</p>') + '</div></div>' +
    receiptHtml +
    (expense.note ? '<div class="detail-info"><div class="field-label">备注</div><div class="detail-note">' + esc(expense.note) + '</div></div>' : '');
  const footer = '<div class="btn-row"><button class="btn btn-ghost" data-action="close-sheet">关闭</button>' +
    (!expense.settled ? '<button class="btn btn-primary" data-action="edit-expense" data-id="' + esc(expense.id) + '">' + icon('edit') + '编辑</button>' : '') + '</div>';
  openSheet({
    title: expense.title || expense.subcategory,
    subtitle: cat.label + ' · ' + (ui.privacyHidden ? '***' : shortDateLabel(expense.date)),
    body,
    footer,
    onMount(backdrop) {
      const open = backdrop.querySelector('#detailReceiptOpen');
      if (open) open.addEventListener('click', () => openImageViewer(expense.receipt));
    }
  });
}

function openLedgerDetails() {
  const project = getCurrentProject();
  if (!project) return;
  const sorted = sortExpenses(project.expenses);
  const groups = {};
  sorted.forEach(exp => {
    if (!groups[exp.date]) groups[exp.date] = [];
    groups[exp.date].push(exp);
  });
  const total = project.expenses.reduce((sum, exp) => sum + exp.amountCents, 0);
  const body = sorted.length
    ? '<div class="ledger-detail-summary"><span>共 ' + sorted.length + ' 笔 · 点一笔可修改</span><strong>' + money(total) + '</strong></div>' +
      Object.keys(groups).sort((a, b) => b.localeCompare(a)).map(date => {
        const dayTotal = groups[date].reduce((sum, exp) => sum + exp.amountCents, 0);
        return '<div class="day-group"><div class="day-head"><span class="day-label">' +
          (date === todayISO() ? '今天' : dateLabel(date, { weekday: true })) + '</span>' +
          '<span class="day-total">' + money(dayTotal) + '</span></div>' +
          '<div class="expense-list">' + groups[date].map(exp => expenseItemHTML(project, exp)).join('') + '</div></div>';
      }).join('')
    : '<div class="empty-inline"><p>还没有账目。</p></div>';
  openSheet({
    title: '账目明细',
    subtitle: '按日期排列 · 点击一笔可编辑',
    body,
    footer: '<button class="btn btn-primary" data-action="close-sheet">完成</button>'
  });
}

function renderSettlementSection(project) {
  const pending = project.expenses.filter(e => !e.settled && needsSettlement(e));
  const pendingTotal = pending.reduce((sum, e) => sum + e.amountCents, 0);
  const summary = computeMemberTotals(project, pending);
  const transfers = computeTransfers(summary);
  const transferTotal = transfers.reduce((sum, t) => sum + t.amountCents, 0);
  const latest = project.settlements[project.settlements.length - 1];
  let content;
  if (!pending.length) {
    content = '<div class="settle-done"><div class="done-icon">' + icon('check') + '</div>' +
      '<div><h3>本次已全部结清</h3><p>' + (latest
        ? '记录于 ' + esc(privacyText(dateTimeLabel(latest.createdAt))) + ' · 共 ' + latest.expenseIds.length + ' 笔'
        : '当前没有待结清账目') + '</p></div>' +
      (latest ? '<button class="btn-link" style="margin-left:auto" data-action="undo-settlement" data-id="' + esc(latest.id) + '">撤销</button>' : '') +
      '</div>';
  } else {
    const transferCards = transfers.length
      ? '<div class="transfer-list compact">' + transfers.map(t => {
          const from = findMember(project, t.fromId);
          const to = findMember(project, t.toId);
          return '<div class="transfer-card compact"><div class="transfer-route">' +
            '<div class="transfer-person">' + memberAvatar(from, 'sm') + '<span>' + esc(t.fromName) + '</span></div>' +
            icon('arrow-right', 'transfer-arrow') +
            '<div class="transfer-person">' + memberAvatar(to, 'sm') + '<span>' + esc(t.toName) + '</span></div></div>' +
            '<div class="transfer-amount">' + money(t.amountCents) + '</div></div>';
        }).join('') + '</div>'
      : '<div class="settle-done" style="background:var(--surface);border-style:dashed"><div class="done-icon">' + icon('check') + '</div>' +
        '<div><h3>无需转账</h3><p>大家的垫付和应摊刚好抵消。</p></div></div>';
    content = '<div class="settle-status"><div><div class="settle-label">待结清账目</div>' +
        '<div class="settle-total tnum">' + money(pendingTotal) + '</div></div>' +
        '<div class="settle-side"><strong>' + (transfers.length ? transfers.length + ' 笔转账' : '无需转账') + '</strong>' +
          '<span>建议合计 ' + money(transferTotal) + '</span></div></div>' +
      '<div class="settle-block">' + transferCards + '</div>' +
      '<div class="settle-actions"><button class="btn btn-primary" data-action="copy-settlement">' + icon('copy') + '复制清单</button>' +
        '<button class="btn btn-secondary" data-action="settle-now">' + icon('check') + '记录结清</button></div>' +
      '<p class="settle-hint">记录结清后账目会锁定；新增支出重新累计。</p>';
  }
  return '<section class="main-section" id="settleSection"><div class="main-section-head"><div><h2 class="main-section-title">结算</h2>' +
    '<p class="main-section-sub">按实际分摊自动计算，直接转账即可</p></div>' +
    '<span class="status-pill ' + (pending.length ? 'upcoming' : 'done') + '"><span class="dot"></span>' +
      (pending.length ? '待结清' : '已结清') + '</span></div>' + content + '</section>';
}

function renderBudgetSection(project) {
  const stats = computeProjectStats(project);
  const budgets = project.budgets || {};
  const hasBudget = CAT_ORDER.some(key => Number(budgets[key]) > 0);
  const maxScale = Math.max(1, ...CAT_ORDER.map(key => Math.max(stats.byCategory[key].cents, Number(budgets[key]) || 0)));
  const rows = CAT_ORDER.map(key => {
    const cat = catMeta(key);
    const actual = stats.byCategory[key].cents;
    const budget = Number(budgets[key]) || 0;
    const actualPct = stats.totalCents ? actual / stats.totalCents * 100 : 0;
    const actualWidth = actual ? Math.max(1.5, actual / maxScale * 100) : 0;
    const marker = budget ? Math.min(100, budget / maxScale * 100) : 0;
    const dev = budget > 0 ? (actual - budget) / budget * 100 : null;
    const devLabel = dev == null ? '未设预算' : (dev > 0.05 ? '+' : dev < -0.05 ? '' : '±') + dev.toFixed(1) + '%';
    const devClass = dev == null ? 'none' : dev > 0.05 ? 'over' : 'under';
    return '<div class="budget-row"><div class="budget-row-icon" style="' + catStyle(cat) + '">' + icon(cat.icon) + '</div>' +
      '<div class="budget-row-main"><div class="budget-row-top"><span class="budget-row-name">' + cat.label + '</span>' +
        '<span class="budget-dev ' + devClass + '">' + devLabel + '</span></div>' +
      '<div class="budget-row-amounts"><span>实际 <strong>' + money(actual) + '</strong> · ' + actualPct.toFixed(0) + '%</span>' +
        '<span>' + (budget ? '预算 ' + money(budget) : '预算未设') + '</span></div>' +
      '<div class="budget-bar"><div class="budget-fill" style="width:' + actualWidth.toFixed(1) + '%;background:' + cat.color + '"></div>' +
        (budget ? '<span class="budget-marker" style="left:calc(' + marker.toFixed(1) + '% - 1px)"></span>' : '') + '</div></div></div>';
  }).join('');
  return '<section class="main-section" id="budgetSection"><div class="main-section-head"><div><h2 class="main-section-title">预算对比</h2>' +
    '<p class="main-section-sub">实际支出 vs 预估预算 · 竖线是预算位置</p></div>' +
    '<button class="main-section-action" data-action="open-budgets">' + (hasBudget ? '调整预算' : '设置预算') + icon('chevron', 'sm') + '</button></div>' +
    (!hasBudget ? '<div class="budget-empty"><p>还没有设置分类预算。填入交通、住宿等预估金额，就能看到超支/节省的百分比。</p>' +
      '<button data-action="open-budgets">去设置</button></div>' : '') +
    '<div class="budget-list">' + rows + '</div></section>';
}

    '</div>' +
    '<section class="summary-card">' +

        '<div class="summary-stat"><span>账目</span><strong>' + stats.expenseCount + ' 笔</strong></div>' +
      '</div>' +
    '</section>' +
    (stats.expenseCount === 0
      ? '<section class="section"><div class="empty-inline"><p>从第一笔开始，把车票、房费或一顿饭记下来。最后会自动算出每个人的应收应付。</p>' +
          '<button class="btn btn-primary btn-sm" data-action="open-expense">' + icon('plus') + '记第一笔</button></div></section>'
      : '<section class="section"><div class="section-head"><div><h2 class="section-title">花在哪里</h2></div>' +

      (limits.length

    '</section>' +
    (recent.length
      ? '<section class="section"><div class="section-head"><h2 class="section-title">最近账目</h2>' +
          '<button class="section-action" data-action="tab" data-tab="ledger">全部' + icon('chevron', 'sm') + '</button></div>' +
          '<div class="expense-list">' + recent.map(e => expenseItemHTML(project, e)).join('') + '</div></section>'

function categoryRowHTML(project, key, stats) {
  const cat = catMeta(key);
  const row = stats.byCategory[key];
  const pct = stats.totalCents ? row.cents / stats.totalCents * 100 : 0;
  return '<button class="cat-row" data-action="open-category" data-cat="' + key + '">' +
    '<span class="cat-icon" style="' + catStyle(cat) + '">' + icon(cat.icon) + '</span>' +
    '<span class="cat-info"><span class="cat-mainline"><span class="cat-name">' + cat.label + '</span>' +
      '<span class="cat-amount">' + money(row.cents) + '</span></span>' +
      '<span class="cat-subline"><span class="cat-count">' + row.count + ' 笔</span>' +
        '<span class="cat-bar"><span class="cat-bar-fill" style="width:' + Math.min(100, pct).toFixed(1) + '%"></span></span>' +
        '<span class="cat-pct">' + pct.toFixed(pct >= 10 ? 0 : 1) + '%</span></span></span>' +

function renderLedger(project) {

  const total = filtered.reduce((sum, e) => sum + e.amountCents, 0);

    groups[e.date].push(e);
  });
  const chips = '<button class="chip ' + (filter === 'all' ? 'on' : '') + '" data-action="filter" data-cat="all">全部 ' + project.expenses.length + '</button>' +
    CAT_ORDER.map(key => {
      const count = project.expenses.filter(e => e.category === key).length;

        '<span class="mini-dot" style="' + catStyle(cat) + '"></span>' + cat.label + ' ' + count + '</button>';

function renderStats(project) {
  const stats = computeProjectStats(project);
  if (!stats.expenseCount) {
    return '<div class="empty-inline" style="margin-top:20px"><p>有账目之后，这里会自动生成分类占比、成员垫付和每日支出。</p>' +
      '<button class="btn btn-primary btn-sm" data-action="open-expense">' + icon('plus') + '记第一笔</button></div>';
  }
  const memberTotals = computeMemberTotals(project);
  const maxPaid = Math.max(1, ...memberTotals.map(m => m.paidCents));
  const catRows = CAT_ORDER.filter(key => stats.byCategory[key].cents > 0);
  let offset = 0;
  const segments = catRows.map(key => {
    const pct = stats.totalCents ? stats.byCategory[key].cents / stats.totalCents * 100 : 0;
    const cat = catMeta(key);
    const dash = Math.max(0, pct - (pct > 1.5 ? 0.7 : 0));
    const seg = '<circle cx="64" cy="64" r="50" fill="none" stroke="' + cat.color + '" stroke-width="15" pathLength="100" ' +
      'stroke-dasharray="' + dash.toFixed(3) + ' ' + (100 - dash).toFixed(3) + '" stroke-dashoffset="' + (-offset).toFixed(3) + '"></circle>';
    offset += pct;
    return seg;
  }).join('');
  const legend = catRows.map(key => {
    const cat = catMeta(key);
    const pct = stats.totalCents ? stats.byCategory[key].cents / stats.totalCents * 100 : 0;
    return '<div class="legend-row"><span class="legend-dot" style="background:' + cat.color + '"></span>' +
      '<span class="legend-name">' + cat.label + '</span>' +
      '<span class="legend-pct">' + pct.toFixed(0) + '%</span>' +
      '<span class="legend-amt">' + money(stats.byCategory[key].cents) + '</span></div>';
  }).join('');
  const daily = {};
  project.expenses.forEach(e => { daily[e.date] = (daily[e.date] || 0) + e.amountCents; });
  const dayKeys = Object.keys(daily).sort();
  const maxDay = Math.max(1, ...dayKeys.map(d => daily[d]));
  const dailyBars = dayKeys.map(date => {
    const pct = Math.max(3, daily[date] / maxDay * 100);
    return '<div class="day-col" title="' + esc(dateLabel(date) + ' ' + money(daily[date])) + '">' +
      '<div class="day-bar-wrap"><div class="day-bar ' + (daily[date] === maxDay ? 'peak' : '') + '" style="height:' + pct.toFixed(1) + '%"></div></div>' +
      '<span class="day-label">' + shortDateLabel(date) + '</span></div>';
  }).join('');
  const memberBars = memberTotals.map(m => {
    const netClass = m.netCents > 0 ? 'net-pos' : m.netCents < 0 ? 'net-neg' : 'net-zero';
    const netText = m.netCents > 0 ? '应收 ' + money(m.netCents) : m.netCents < 0 ? '应付 ' + money(-m.netCents) : '刚好平';
    return '<div class="member-bar-row"><div class="member-bar-head">' + memberAvatar(m, 'sm') +
        '<span class="member-bar-name">' + esc(m.name) + '</span>' +
        '<span class="member-bar-net ' + netClass + '">' + netText + '</span></div>' +
      '<div class="member-bar-amounts"><span>垫付 ' + money(m.paidCents) + '</span><span>应摊 ' + money(m.shareCents) + '</span></div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + (m.paidCents > 0 ? Math.max(2, m.paidCents / maxPaid * 100) : 0).toFixed(1) + '%;background:' + esc(m.color) + '"></div></div></div>';
  }).join('');
  return '<div class="stat-hero"><div class="label">行程总支出</div><div class="big tnum">' + money(stats.totalCents) + '</div>' +
      '<div class="sub">' + project.members.length + ' 人 · 人均 ' + money(stats.avgCents) + ' · ' + stats.expenseCount + ' 笔账目</div></div>' +
    '<section class="stats-card"><div class="stats-card-head"><h2 class="stats-card-title">分类占比</h2><span class="stats-card-note">按金额</span></div>' +
      '<div class="donut-layout"><div class="donut-wrap"><svg viewBox="0 0 128 128" aria-hidden="true">' +
        '<circle cx="64" cy="64" r="50" fill="none" stroke="#ece8df" stroke-width="15"></circle>' + segments + '</svg>' +
        '<div class="donut-center"><span>总支出</span><strong>' + money(stats.totalCents) + '</strong></div></div>' +
        '<div class="legend">' + legend + '</div></div></section>' +
    '<section class="stats-card"><div class="stats-card-head"><h2 class="stats-card-title">成员垫付与应收</h2><span class="stats-card-note">含已结清</span></div>' +
      '<div class="member-bars">' + memberBars + '</div></section>' +
    '<section class="stats-card"><div class="stats-card-head"><h2 class="stats-card-title">每日支出</h2><span class="stats-card-note">共 ' + dayKeys.length + ' 天有账目</span></div>' +
      '<div class="daily-chart">' + dailyBars + '</div></section>';
}

function renderSettlement(project) {
  const pending = project.expenses.filter(e => !e.settled);
  const pendingTotal = pending.reduce((sum, e) => sum + e.amountCents, 0);
  const summary = computeMemberTotals(project, pending);
  const transfers = computeTransfers(summary);
  const history = project.settlements.slice().reverse();
  const historyHtml = history.length
    ? '<section class="section"><div class="section-head"><h2 class="section-title">结清记录 <span class="count">' + history.length + '</span></h2></div>' +
      '<div class="history-list">' + history.map((s, index) => {
        const transferText = s.transfers.length
          ? s.transfers.map(t => t.fromName + ' → ' + t.toName + ' ' + money(t.amountCents)).join(' · ')
          : '无需转账，账目已平';
        return '<div class="history-card"><div class="history-head"><div><div class="history-title">已结清 ' + s.expenseIds.length + ' 笔账目</div>' +
          '<div class="history-date">' + esc(privacyText(dateTimeLabel(s.createdAt))) + '</div></div>' +
          '<div class="history-amount">' + money(s.totalCents) + '</div></div>' +
          '<div class="history-transfers">' + esc(transferText) + '</div>' +
          (index === 0 ? '<div class="history-actions"><button class="btn-link" data-action="undo-settlement" data-id="' + esc(s.id) + '">撤销这次结清</button></div>' : '') +
        '</div>';
      }).join('') + '</div></section>'
    : '';
  if (!pending.length) {
    return '<div class="settle-hero done"><div class="eyebrow">结算状态</div><div class="big">' + (project.expenses.length ? '已全部结清' : '还没有账目') + '</div>' +
      '<div class="copy">' + (project.expenses.length
        ? '当前没有待结清账目。新增账目后，会自动重新计算。'
        : '记下第一笔支出后，这里会给出建议的转账方案。') + '</div></div>' +
      historyHtml;
  }
  const transferCards = transfers.length
    ? '<div class="transfer-list">' + transfers.map(t => {
        const from = findMember(project, t.fromId);
        const to = findMember(project, t.toId);
        return '<div class="transfer-card"><div class="transfer-route">' +
          '<div class="transfer-person">' + memberAvatar(from, 'sm') + '<span>' + esc(t.fromName) + '</span></div>' +
          icon('arrow-right', 'transfer-arrow') +
          '<div class="transfer-person">' + memberAvatar(to, 'sm') + '<span>' + esc(t.toName) + '</span></div></div>' +
          '<div class="transfer-amount">' + money(t.amountCents) + '</div></div>';
      }).join('') + '</div>'
    : '<div class="empty-inline" style="padding:17px"><p style="margin-bottom:0">大家的垫付和应摊刚好抵消，这次不需要转账。</p></div>';
  const transferTotalCents = transfers.reduce((sum, t) => sum + t.amountCents, 0);
  const balanceRows = summary.map(m => {
    const netClass = m.netCents > 0 ? 'net-pos' : m.netCents < 0 ? 'net-neg' : 'net-zero';
    const netText = m.netCents > 0 ? '应收 ' + money(m.netCents) : m.netCents < 0 ? '应付 ' + money(-m.netCents) : '已平';
    return '<div class="balance-row">' + memberAvatar(m, 'sm') +
      '<span class="balance-name">' + esc(m.name) + '</span>' +
      '<span class="balance-detail">垫付 ' + money(m.paidCents) + ' · 应摊 ' + money(m.shareCents) + '</span>' +
      '<span class="balance-net ' + netClass + '">' + netText + '</span></div>';
  }).join('');
  return '<div class="settle-hero"><div class="eyebrow">待结清账目 · ' + pending.length + ' 笔</div>' +
      '<div class="big tnum">' + money(pendingTotal) + '</div>' +
      '<div class="copy">' + (transfers.length
        ? '按每人实际分摊计算，建议 ' + transfers.length + ' 笔转账，合计 ' + money(transferTotalCents) + '。'
        : '按每人实际分摊计算，大家刚好互相抵消，本次无需转账。') +
        (project.settlements.length ? '已结清的历史账目不计入本次。' : '') + '</div></div>' +
    '<section class="section" style="margin-top:16px"><div class="section-head"><h2 class="section-title">建议转账</h2>' +
      '<span class="section-sub" style="margin:0">' + (transfers.length ? transfers.length + ' 笔' : '无需转账') + '</span></div>' +
      transferCards +
      '<div class="btn-row"><button class="btn btn-primary" data-action="copy-settlement">' + icon('copy') + '复制清单</button>' +
        '<button class="btn btn-secondary" data-action="settle-now">' + icon('check') + '记录结清</button></div>' +
      '<p class="field-hint" style="text-align:center">记录结清后，本次账目会锁住，新增支出重新累计。</p></section>' +
    '<section class="section"><div class="section-head"><h2 class="section-title">成员收支</h2>' +
      '<span class="section-sub" style="margin:0">' + project.members.length + ' 人</span></div>' +
      '<div class="balance-list">' + balanceRows + '</div></section>' +
    historyHtml;
}

function openSheet(options) {
  closeSheet();
  const layer = document.getElementById('layer-root');
  const backdrop = document.createElement('div');
  backdrop.className = 'sheet-backdrop';
  const titleId = uid('sheet');
  backdrop.innerHTML = '<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="' + titleId + '">' +
    '<div class="sheet-head"><div class="sheet-heading"><div class="sheet-title" id="' + titleId + '">' + esc(options.title || '') + '</div>' +
      (options.subtitle ? '<div class="sheet-sub">' + esc(options.subtitle) + '</div>' : '') + '</div>' +
      '<button class="sheet-close" data-action="close-sheet" aria-label="关闭">' + icon('close') + '</button></div>' +
    '<div class="sheet-body">' + (options.body || '') + '</div>' +
    (options.footer ? '<div class="sheet-footer">' + options.footer + '</div>' : '') +
  '</section>';
  layer.appendChild(backdrop);
  activeSheet = backdrop;
  document.body.classList.add('sheet-open');
  backdrop.addEventListener('click', event => {
    if (event.target === backdrop) closeSheet();
  });
  const closeBtn = backdrop.querySelector('.sheet-close');
  if (closeBtn) closeBtn.addEventListener('click', closeSheet);
  if (typeof options.onMount === 'function') options.onMount(backdrop);
  return backdrop;
}

function closeSheet() {
  if (!activeSheet) return;
  activeSheet.remove();
  activeSheet = null;
  document.body.classList.remove('sheet-open');
}

function confirmDialog(options) {
  return new Promise(resolve => {
    const layer = document.getElementById('layer-root');
    const wrap = document.createElement('div');
    wrap.className = 'dialog-backdrop';
    wrap.innerHTML = '<div class="dialog" role="alertdialog" aria-modal="true">' +
      '<div class="dialog-icon ' + (options.danger ? 'danger' : '') + '">' + icon(options.danger ? 'trash' : 'info') + '</div>' +
      '<div class="dialog-title">' + esc(options.title || '请确认') + '</div>' +
      '<div class="dialog-copy">' + esc(options.message || '') + '</div>' +
      '<div class="dialog-actions"><button class="btn btn-ghost" data-dialog="cancel">' + esc(options.cancelText || '取消') + '</button>' +
        '<button class="btn ' + (options.danger ? 'btn-danger' : 'btn-primary') + '" data-dialog="ok">' + esc(options.okText || '确认') + '</button></div></div>';
    layer.appendChild(wrap);
    let settled = false;
    function done(value) {
      if (settled) return;
      settled = true;
      document.removeEventListener('keydown', onKey);
      wrap.remove();
      resolve(value);
    }
    function onKey(event) {
      if (event.key === 'Escape') done(false);
      if (event.key === 'Enter' && !options.danger) done(true);
    }
    wrap.querySelector('[data-dialog="cancel"]').addEventListener('click', () => done(false));
    wrap.querySelector('[data-dialog="ok"]').addEventListener('click', () => done(true));
    wrap.addEventListener('click', event => { if (event.target === wrap) done(false); });
    document.addEventListener('keydown', onKey);
    setTimeout(() => {
      const preferred = wrap.querySelector(options.danger ? '[data-dialog="cancel"]' : '[data-dialog="ok"]');
      if (preferred) preferred.focus();
    }, 30);
  });
}

function openImageViewer(src) {
  if (!src) return;
  const layer = document.getElementById('layer-root');
  const wrap = document.createElement('div');
  wrap.className = 'image-viewer';
  wrap.innerHTML = '<img src="' + src + '" alt="支付清单"><button class="image-viewer-close" aria-label="关闭">' + icon('close') + '</button>';
  layer.appendChild(wrap);
  wrap.addEventListener('click', event => {
    if (event.target === wrap || event.target.closest('.image-viewer-close')) wrap.remove();
  });
}

function toast(message, kind = 'ok') {
  if (kind === 'ok' && storageFailed) return;
  const root = document.getElementById('toast-root');
  if (!root) return;
  while (root.children.length >= 3) root.firstElementChild.remove();
  const el = document.createElement('div');
  el.className = 'toast ' + (kind === 'warn' ? 'warn' : kind === 'error' ? 'error' : '');
  el.textContent = message;
  root.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = 'opacity .2s ease';
    setTimeout(() => el.remove(), 220);
  }, 2500);
}

function downloadTextFile(filename, text, mime) {
  try {
    const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = filename;
    anchor.rel = 'noopener';
    anchor.style.display = 'none';
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    return true;
  } catch (err) {
    console.warn(err);
    toast('文件生成失败，请稍后再试', 'error');
    return false;
  }
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (_) { /* 继续用兜底方案 */ }
  try {
    const area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', 'readonly');
    area.style.position = 'fixed';
    area.style.top = '-1000px';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    area.setSelectionRange(0, area.value.length);
    const ok = document.execCommand('copy');
    area.remove();
    return ok;
  } catch (_) {
    return false;
  }
}

          draft.colors[i] = input.value;
          const block = input.closest('.np-color-block');
          if (block) {
            block.style.background = input.value;
            block.style.color = contrastText(input.value);
          }
        }));
      }
      function showError(message) {
        errorBox.innerHTML = message ? '<div class="form-error">' + esc(message) + '</div>' : '';
        if (message) toast(message, 'warn');
      }
      renderMembers();
      backdrop.querySelectorAll('[data-palette]').forEach(btn => {
        btn.addEventListener('click', () => {
          syncFromInputs();
          const palette = btn.dataset.palette === 'morandi' ? MORANDI_COLORS : MEMBER_COLORS;
          draft.colors = draft.names.map((_, i) => palette[i % palette.length]);
          renderMembers();
        });
      });
      backdrop.querySelector('#npMinus').addEventListener('click', () => {
        syncFromInputs();
        if (draft.names.length <= 2) return;
        draft.names.pop(); draft.colors.pop();
        renderMembers();
      });
      backdrop.querySelector('#npPlus').addEventListener('click', () => {
        syncFromInputs();
        if (draft.names.length >= 10) return;
        const nextColor = ALL_MEMBER_COLORS.find(c => !draft.colors.includes(c)) || ALL_MEMBER_COLORS[0];
        draft.names.push('');
        draft.colors.push(nextColor);
        renderMembers();
        const inputs = memberBox.querySelectorAll('.np-name');
        if (inputs.length) inputs[inputs.length - 1].focus();
      });
      startInput.addEventListener('change', () => {
        endInput.min = startInput.value || '';
        if (!endInput.value || endInput.value < startInput.value) endInput.value = startInput.value;
      });
      endInput.min = startInput.value;
      form.addEventListener('submit', event => {
        event.preventDefault();
        showError('');
        const name = nameInput.value.trim();
        syncFromInputs();
        const names = draft.names.map(n => n.trim());
        const colors = draft.colors.map(c => String(c || '').toLowerCase());
        const start = startInput.value;
        const end = endInput.value;
        if (!name) { showError('请填写项目名称'); nameInput.focus(); return; }
        if (names.length < 2 || names.length > 10) { showError('同行人数需要是 2–10 人'); return; }
        if (names.some(n => !n)) { showError('请把每一位成员的名字填写完整'); return; }
        if (new Set(names).size !== names.length) { showError('成员名字不能重复，方便分账时区分'); return; }
        if (colors.some(c => !/^#[0-9a-f]{6}$/i.test(c))) { showError('成员底色无效，请重新选择'); return; }
        if (new Set(colors).size !== colors.length) { showError('成员底色不要重复，方便一眼区分'); return; }
        if (!parseISO(start) || !parseISO(end)) { showError('请选择有效的开始和结束日期'); return; }
        if (end < start) { showError('结束日期不能早于开始日期'); return; }
        const now = nowISO();
        const project = normalizeProject({
          id: uid('p'),
          name: name.slice(0, 30),
          startDate: start,
          endDate: end,
          note: '',
          members: names.map((n, i) => ({ id: uid('m'), name: n, code: initialOf(n), color: colors[i] })),
          expenses: [],
          limits: [],
          budgets: {},
          settlements: [],
          createdAt: now,
          updatedAt: now
        });
        db.projects.push(project);
        saveDB();
        closeSheet();
        goProject(project.id);
        toast('项目已创建');
      });
    }
  });
  return sheet;
}

function openSubcategoryEditor(project, categoryKey) {
  if (!project || !CATEGORIES[categoryKey]) return;
  const cat = catMeta(categoryKey);
  const oldList = projectSubs(project, categoryKey).slice();
  const rowHtml = (value, old) =>
    '<div class="subcat-edit-row">' +
      '<input class="input subcat-edit-input" maxlength="20" value="' + esc(value) + '" data-old="' + esc(old || '') + '" placeholder="细项名称">' +
      '<button type="button" class="subcat-remove" data-remove-sub aria-label="删除">' + icon('close') + '</button>' +
    '</div>';
  const body = '<form id="subcategoryForm" novalidate>' +
    '<p class="help-text" style="margin-top:0">编辑「' + cat.label + '」下的具体选项。已用于账目的细项不能删除；改名会同步更新已有账目。</p>' +
    '<div class="subcat-edit-list" id="subcatRows">' + oldList.map(name => rowHtml(name, name)).join('') + '</div>' +
    '<button type="button" class="btn-link" id="addSubcategory">+ 新增细项</button>' +
    '<div id="subcategoryError" style="margin-top:10px"></div>' +
  '</form>';
  openSheet({
    title: '编辑分类细项',
    subtitle: cat.label,
    body,
    footer: '<button class="btn btn-primary" type="submit" form="subcategoryForm">' + icon('check') + '保存细项</button>',
    onMount(backdrop) {
      const form = backdrop.querySelector('#subcategoryForm');
      const list = backdrop.querySelector('#subcatRows');
      const errorBox = backdrop.querySelector('#subcategoryError');
      const showError = message => {
        errorBox.innerHTML = '<div class="form-error">' + esc(message) + '</div>';
        toast(message, 'warn');
      };
      list.addEventListener('click', event => {
        const button = event.target.closest('[data-remove-sub]');
        if (button) button.closest('.subcat-edit-row').remove();
      });
      backdrop.querySelector('#addSubcategory').addEventListener('click', () => {
        list.insertAdjacentHTML('beforeend', rowHtml('', ''));
        const inputs = list.querySelectorAll('.subcat-edit-input');
        if (inputs.length) inputs[inputs.length - 1].focus();
      });
      form.addEventListener('submit', event => {
        event.preventDefault();
        const rows = Array.from(list.querySelectorAll('.subcat-edit-row')).map(row => {
          const input = row.querySelector('.subcat-edit-input');
          return { old: input.dataset.old || '', value: input.value.trim() };
        });
        if (!rows.length) { showError('至少保留一个具体选项'); return; }
        if (rows.some(row => !row.value)) { showError('细项名称不能为空'); return; }
        if (rows.length > 30) { showError('每个大项最多 30 个细项'); return; }
        const values = rows.map(row => row.value.slice(0, 20));
        if (new Set(values).size !== values.length) { showError('细项名称不能重复'); return; }
        const used = {};
        project.expenses.forEach(exp => {
          if (exp.category === categoryKey) used[exp.subcategory] = (used[exp.subcategory] || 0) + 1;
        });
        const keptOld = new Set(rows.map(row => row.old).filter(Boolean));
        for (const name of oldList) {
          if (!keptOld.has(name) && used[name]) {
            showError('「' + name + '」已有 ' + used[name] + ' 笔账目，不能删除；请先改对应账目');
            return;
          }
        }
        rows.forEach(row => {
          if (!row.old || row.old === row.value) return;
          project.expenses.forEach(exp => {
            if (exp.category === categoryKey && exp.subcategory === row.old) exp.subcategory = row.value.slice(0, 20);
          });
        });
        project.subcategories = project.subcategories || {};
        project.subcategories[categoryKey] = values;
        touchProject(project);
        saveDB();
        closeSheet();
        renderApp();
        toast('分类细项已更新');
      });
    }
  });
}

/* ---------- 成员编辑 ---------- */
function openMemberEditor(project, memberId) {
  const member = memberId ? findMember(project, memberId) : null;
  if (memberId && !member) return;
  const used = member ? project.expenses.some(e =>
    e.payerId === member.id ||
    (e.participants || []).includes(member.id) ||
    Object.prototype.hasOwnProperty.call(e.weights || {}, member.id) ||
    Object.prototype.hasOwnProperty.call(e.customCents || {}, member.id)
  ) : false;
  const usedColors = project.members.filter(m => !member || m.id !== member.id).map(m => m.color);
  const defaultColor = member ? member.color : (ALL_MEMBER_COLORS.find(c => !usedColors.includes(c)) || ALL_MEMBER_COLORS[0]);
  let selectedColor = defaultColor;
  let selectedCode = member ? initialOf(member.name) : '';
  const body = '<div style="text-align:center;margin:2px 0 17px">' +
      '<div id="memberPreview" class="avatar xl" style="background:' + esc(selectedColor) + ';color:' + contrastText(selectedColor) + ';margin:0 auto 7px">' + esc(selectedCode || '?') + '</div>' +
      '<div class="stats-card-note">方形色块 + 名字首字</div></div>' +
    '<form id="memberForm" novalidate>' +
      '<div class="field"><label class="field-label" for="memberName">成员名字</label>' +
        '<input class="input" id="memberName" maxlength="12" value="' + esc(member ? member.name : '') + '" placeholder="例如：小林" autocomplete="off"></div>' +
      '<div class="field"><div class="field-label">代表底色 <span class="optional">方形矩阵</span></div>' +
        '<div class="swatches" id="memberSwatches">' +
          '<div class="swatch-group-label">清透</div>' + MEMBER_COLORS.map(c =>
            '<button type="button" class="swatch ' + (c === selectedColor ? 'on' : '') + '" data-color="' + c + '" style="background:' + c + '" aria-label="颜色 ' + c + '"></button>').join('') +
          '<div class="swatch-group-label">莫兰迪</div>' + MORANDI_COLORS.map(c =>
            '<button type="button" class="swatch ' + (c === selectedColor ? 'on' : '') + '" data-color="' + c + '" style="background:' + c + '" aria-label="颜色 ' + c + '"></button>').join('') +
        '</div>' +
        '<div class="image-setting-row"><label class="color-custom-label">自定义 <input type="color" id="memberColorInput" class="member-color-input" value="' + esc(selectedColor) + '"></label></div>' +
        (usedColors.length ? '<p class="field-hint">已使用的颜色会被其他成员占用，选择时请避免重复。</p>' : '') +
      '</div>' +
      '<div id="memberError"></div>' +
    '</form>' +
    (member && used ? '<p class="help-text">这位成员已有账目记录，为了不打乱历史分账，暂不能删除。可以先撤销相关结算并修改账目。</p>' : '') +
    (member && !used ? '<button class="btn btn-danger btn-block btn-sm" type="button" id="memberDelete">' + icon('trash') + '删除这位成员</button>' : '');
  openSheet({
    title: member ? '编辑成员' : '添加成员',
    subtitle: member ? member.name : '最多 10 人',
    body,
    footer: '<button class="btn btn-primary" type="submit" form="memberForm">' + icon('check') + '保存成员</button>',
    onMount(backdrop) {
      const nameInput = backdrop.querySelector('#memberName');
      const colorInput = backdrop.querySelector('#memberColorInput');
      const preview = backdrop.querySelector('#memberPreview');
      const errorBox = backdrop.querySelector('#memberError');
      const form = backdrop.querySelector('#memberForm');
      function showMemberError(message) {
        errorBox.innerHTML = '<div class="form-error">' + esc(message) + '</div>';
        toast(message, 'warn');
      }
      function refreshPreview() {
        selectedCode = initialOf(nameInput.value.trim() || '?') || '?';
        preview.style.background = selectedColor;
        preview.style.color = contrastText(selectedColor);
        preview.textContent = selectedCode;
        colorInput.value = selectedColor;
      }
      nameInput.addEventListener('input', refreshPreview);
      backdrop.querySelectorAll('.swatch').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedColor = btn.dataset.color;
          backdrop.querySelectorAll('.swatch').forEach(sw => sw.classList.toggle('on', sw === btn));
          refreshPreview();
        });
      });
      colorInput.addEventListener('input', () => {
        selectedColor = colorInput.value;
        backdrop.querySelectorAll('.swatch').forEach(sw => sw.classList.toggle('on', sw.dataset.color === selectedColor));
        refreshPreview();
      });
      form.addEventListener('submit', event => {
        event.preventDefault();
        const name = nameInput.value.trim();
        const code = initialOf(name);
        if (!name) { showMemberError('请填写成员名字'); return; }
        if (project.members.some(m => m.id !== (member && member.id) && m.name === name)) {
          showMemberError('已有同名成员，请换一个称呼'); return;
        }
        if (project.members.some(m => m.id !== (member && member.id) && m.color === selectedColor)) {
          showMemberError('这个颜色已被其他成员使用，请换一个'); return;
        }
        if (!member && project.members.length >= 10) { showMemberError('最多 10 位成员'); return; }
        if (member) {
          member.name = name;
          member.code = code;
          member.color = selectedColor;
        } else {
          project.members.push(makeMember(name, selectedColor, null, code));
        }
        touchProject(project);
        saveDB();
        renderApp();
        closeSheet();
        openSettings();
        toast(member ? '成员已更新' : '成员已添加');
      });
      const deleteBtn = backdrop.querySelector('#memberDelete');
      if (deleteBtn) {
        deleteBtn.addEventListener('click', async () => {
          if (project.members.length <= 2) { toast('至少保留 2 位成员', 'warn'); return; }
          const ok = await confirmDialog({
            title: '删除这位成员？',
            message: '将删除「' + member.name + '」。这位成员没有账目记录，可以安全删除。',
            okText: '删除',
            danger: true
          });
          if (!ok) return;
          project.members = project.members.filter(m => m.id !== member.id);
          touchProject(project);
          saveDB();
          renderApp();
          closeSheet();
          openSettings();
          toast('成员已删除');
        });
      }
    }
  });
}

/* ---------- 限额编辑 ---------- */
function openLimitEditor(project, limitId) {
  const existing = limitId ? project.limits.find(l => l.id === limitId) : null;
  if (limitId && !existing) return;
  let category = existing ? existing.category : 'dining';
  let period = existing ? existing.period : 'day';
  let scope = existing ? existing.scope : 'person';
  const categories = CAT_ORDER.concat(['total']);
  const categoryButtons = categories.map(key => {
    const isTotal = key === 'total';
    const cat = isTotal ? { label: '总支出', icon: 'wallet', color: '#645074', soft: '#efe9f2' } : catMeta(key);
    return '<button type="button" class="category-btn ' + (key === category ? 'on' : '') + '" data-limit-cat="' + key + '" style="' + catStyle(cat) + '">' +
      icon(cat.icon) + '<span>' + cat.label + '</span></button>';
  }).join('');
  const body = '<form id="limitForm" novalidate>' +
    '<div class="field"><div class="field-label">限制哪一类</div>' +
      '<div class="category-picker" id="limitCats" style="grid-template-columns:repeat(3,1fr)">' + categoryButtons + '</div></div>' +
    '<div class="field"><div class="field-label">统计周期</div>' +
      '<div class="segmented" id="limitPeriod"><button type="button" class="seg-btn ' + (period === 'day' ? 'on' : '') + '" data-period="day">每天</button>' +
        '<button type="button" class="seg-btn ' + (period === 'trip' ? 'on' : '') + '" data-period="trip">全程</button></div></div>' +
    '<div class="field"><div class="field-label">按谁计算</div>' +
      '<div class="segmented" id="limitScope"><button type="button" class="seg-btn ' + (scope === 'person' ? 'on' : '') + '" data-scope="person">每人</button>' +
        '<button type="button" class="seg-btn ' + (scope === 'group' ? 'on' : '') + '" data-scope="group">全组</button></div></div>' +
    '<div class="field"><label class="field-label" for="limitAmount">限额金额</label>' +
      '<input class="input" id="limitAmount" inputmode="decimal" value="' + (existing ? centsToInput(existing.amountCents) : '') + '" placeholder="例如：120">' +
      '<p class="field-hint" id="limitHint"></p></div>' +

          backdrop.querySelectorAll('[data-scope]').forEach(b => b.classList.toggle('on', b === btn));
          updateHint();
        });
      });
      updateHint();
      form.addEventListener('submit', event => {
        event.preventDefault();
        const cents = parseAmountExpression(amountInput.value);
        if (!Number.isFinite(cents) || cents <= 0) {
          errorBox.innerHTML = '<div class="form-error">请输入大于 0 的限额金额</div>';
          toast('请输入大于 0 的限额金额', 'warn');
          return;
        }
        errorBox.innerHTML = '';
        if (existing) {
          existing.category = category;
          existing.period = period;
          existing.scope = scope;
          existing.amountCents = cents;
        } else {
          project.limits.push({ id: uid('l'), category, period, scope, amountCents: cents });
        }
        touchProject(project);
        saveDB();
        renderApp();
        closeSheet();
        openSettings();
        toast('报销限额已保存');
      });
      const deleteBtn = backdrop.querySelector('#limitDelete');
      if (deleteBtn) {
        deleteBtn.addEventListener('click', async () => {
          const ok = await confirmDialog({
            title: '删除这条限额？', message: '删除后不会再提醒这一类花费。', okText: '删除', danger: true
          });
          if (!ok) return;
          project.limits = project.limits.filter(l => l.id !== existing.id);
          touchProject(project);
          saveDB();
          renderApp();
          closeSheet();
          openSettings();
          toast('限额已删除');
        });
      }
    }
  });
}

function compressImageFile(file, maxSide, quality, maxLength) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) { reject(new Error('请选择图片文件')); return; }
    const limitedSide = Number(maxSide) || 1400;
    const limitedQuality = Number(quality) || 0.78;
    const limitedLength = Number(maxLength) || 1700000;
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('读取图片失败'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('图片格式不支持'));
      img.onload = () => {
        try {
          const maxSide = limitedSide;
          const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.width * scale));
          canvas.height = Math.max(1, Math.round(img.height * scale));
          const ctx = canvas.getContext('2d');
          if (!ctx) { reject(new Error('图片处理失败')); return; }
          ctx.fillStyle = '#1b3b32';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL('image/jpeg', limitedQuality);
          if (dataUrl.length > limitedLength) { reject(new Error('图片还是太大，请选择尺寸更小的图片')); return; }
          resolve(dataUrl);
        } catch (err) { reject(err); }
      };
      img.src = String(reader.result || '');
    };
    reader.readAsDataURL(file);
  });
}

function exportAllJSON() {

  };

function csvCell(value) {
  let s = String(value == null ? '' : value);
  if (/^[=+\-@]/.test(s)) s = "'" + s;
  return '"' + s.replace(/"/g, '""') + '"';
}

function exportProjectCSV(project) {
  if (!project) return;
  if (!project.expenses.length) { toast('这个项目还没有账目', 'warn'); return; }
  const rows = [['日期', '大类', '细项', '内容', '具体明细', '暂付款方', '金额(元)', '分摊方式', '分摊明细', '备注', '凭证', '状态']];
  sortExpenses(project.expenses).slice().reverse().forEach(exp => {
    const payer = findMember(project, exp.payerId);
    const shares = computeExpenseShares(project, exp);
    const detail = project.members.filter(m => exp.participants.includes(m.id))
      .map(m => m.name + ' ' + yuanFixed(shares[m.id] || 0)).join('；');
    rows.push([
      exp.date,
      catMeta(exp.category).label,
      exp.subcategory,
      exp.title || exp.subcategory,
      exp.detail,
      exp.payerId === EXTERNAL_PAYER_ID ? '其他' : (payer ? payer.name : '未知'),
      yuanFixed(exp.amountCents),
      SPLIT_LABELS[exp.splitMode],
      detail,
      exp.note,
      exp.receipt ? '有' : '无',
      exp.settled ? '已结清' : (needsSettlement(exp) ? '待结清' : '无需结算')
    ]);
  });
  const csv = '\ufeff' + rows.map(row => row.map(csvCell).join(',')).join('\r\n');
  const safeName = project.name.replace(/[\\/:*?"<>|]/g, '_');
  if (downloadTextFile(safeName + '-账目-' + todayISO() + '.csv', csv, 'text/csv;charset=utf-8')) {
    toast('账目文件已生成');
  }
}

function pickImportFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.addEventListener('change', () => {
    const file = input.files && input.files[0];
    input.remove();
    if (!file) return;
    importJSONFile(file);
  });
  input.addEventListener('cancel', () => input.remove());
  input.click();
}

function validateBackupProject(raw) {
  if (!raw || typeof raw !== 'object') return '项目格式不正确';
  if (!raw.name || !String(raw.name).trim()) return '缺少项目名称';
  if (!parseISO(raw.startDate) || !parseISO(raw.endDate)) return '行程日期无效';
  if (raw.endDate < raw.startDate) return '行程结束日期早于开始日期';
  if (!Array.isArray(raw.members) || raw.members.length < 2 || raw.members.length > 10) return '成员数量不是 2–10 人';
  if (!Array.isArray(raw.expenses)) return '账目列表格式不正确';
  const memberIds = new Set();
  const memberNames = new Set();
  const memberColors = new Set();
  for (const m of raw.members) {
    if (!m || typeof m !== 'object' || !m.id || !m.name) return '成员信息不完整';
    const id = String(m.id);
    if (safeId(id, 'm') !== id) return '成员 ID 含不支持字符';
    if (memberIds.has(id)) return '成员 ID 重复';
    const name = String(m.name).trim();
    if (!name) return '成员名字为空';
    if (memberNames.has(name)) return '成员名字重复：' + name;
    const color = String(m.color || '').toLowerCase();
    if (!/^#[0-9a-f]{6}$/.test(color)) return '成员颜色格式无效';
    if (memberColors.has(color)) return '成员颜色重复';
    memberIds.add(id);
    memberNames.add(name);
    memberColors.add(color);
  }
  const expenseIds = new Set();
  const subcategoryMap = normalizeSubcategories(raw.subcategories);
  for (const exp of raw.expenses) {
    if (!exp || typeof exp !== 'object' || !exp.id) return '账目信息不完整';
    const expId = String(exp.id);
    if (safeId(expId, 'e') !== expId) return '账目 ID 含不支持字符';
    if (expenseIds.has(expId)) return '账目 ID 重复';
    expenseIds.add(expId);
    if (!parseISO(exp.date)) return '账目日期无效：' + (exp.title || expId);
    if (!CATEGORIES[exp.category]) return '账目大类无效';
    if (!subcategoryMap[exp.category].includes(exp.subcategory)) return '账目细项无效';
    if (!SPLIT_LABELS[exp.splitMode]) return '分摊方式无效';
    const amount = Number(exp.amountCents);
    if (!Number.isFinite(amount) || Math.round(amount) !== amount || amount <= 0) return '账目金额无效';
    if (exp.receipt && !isImageDataUrl(exp.receipt, 950000)) return '支付清单图片格式无效';
    if (String(exp.payerId) !== EXTERNAL_PAYER_ID && !memberIds.has(String(exp.payerId))) return '暂付款方不在成员列表中';
    if (!Array.isArray(exp.participants) || !exp.participants.length) return '账目缺少分摊成员';
    const participants = exp.participants.map(String);
    if (new Set(participants).size !== participants.length) return '分摊成员重复';
    if (participants.some(id => !memberIds.has(id))) return '分摊成员不在成员列表中';
    if (exp.splitMode === 'personal' && participants.length !== 1) return '个人承担只能指定一位成员';
    if (exp.splitMode === 'weights') {
      const weights = exp.weights || {};
      if (participants.some(id => {
        const w = Number(weights[id]);
        return !Number.isFinite(w) || w <= 0 || w > 10000;
      })) return '按份数分摊的权重无效';
    }
    if (exp.splitMode === 'amounts') {
      const custom = exp.customCents || {};
      if (participants.some(id => {
        const cents = Number(custom[id]);
        return !Number.isFinite(cents) || cents < 0;
      })) return '指定金额无效';
      const sum = participants.reduce((total, id) => total + Math.round(Number(custom[id])), 0);
      if (sum !== amount) return '指定金额的合计与总额不一致';
    }
  }
  if (raw.budgets != null) {
    if (typeof raw.budgets !== 'object' || Array.isArray(raw.budgets)) return '预算格式不正确';
    for (const key of Object.keys(raw.budgets)) {
      if (!CAT_ORDER.includes(key)) return '预算分类无效';
      const value = Number(raw.budgets[key]);
      if (!Number.isFinite(value) || value < 0) return '预算金额无效';
    }
  }
  return '';
}

async function importJSONFile(file) {
  let text;
  try {
    text = await file.text();
  } catch (err) {
    toast('读取文件失败', 'error');
    return;
  }
  let payload;
  try {
    payload = JSON.parse(String(text || '').replace(/^\uFEFF/, ''));
  } catch (err) {
    toast('这不是有效的 JSON 备份文件', 'error');
    return;
  }
  let rawList = [];
  if (Array.isArray(payload)) rawList = payload;
  else if (payload && Array.isArray(payload.projects)) rawList = payload.projects;
  else if (payload && payload.name && payload.members) rawList = [payload];
  rawList = rawList.filter(p => p && typeof p === 'object' && p.name && Array.isArray(p.members));
  if (!rawList.length) { toast('文件里没有可导入的项目', 'error'); return; }
  const issues = [];
  rawList.forEach((raw, index) => {
    const issue = validateBackupProject(raw);
    if (issue) issues.push('第 ' + (index + 1) + ' 个项目：' + issue);
  });
  if (issues.length) {
    await confirmDialog({
      title: '备份校验未通过',
      message: issues.slice(0, 4).join('\n') + (issues.length > 4 ? '\n另有 ' + (issues.length - 4) + ' 个问题' : '') +
        '\n\n为避免账目被静默改写，本次没有导入任何数据。',
      okText: '知道了',
      cancelText: '关闭'
    });
    return;
  }
  const ok = await confirmDialog({
    title: '导入 ' + rawList.length + ' 个项目？',
    message: '导入的项目会追加到现有数据中，不会覆盖本机项目。同名项目也会保留。',
    okText: '导入'
  });
  if (!ok) return;
  let added = 0;
  rawList.forEach(raw => {
    const project = normalizeProject(raw);
    if (db.projects.some(p => p.id === project.id)) {
      project.id = uid('p');
      project.name = (project.name + '（导入）').slice(0, 40);
    }
    db.projects.push(project);
    added++;
  });
  if (payload && payload.settings) db.settings = normalizeAppSettings(payload.settings);
  saveDB();
  applyAppearance();
  closeSheet();
  goHome();
  toast('已导入 ' + added + ' 个项目');
}
